      responses:
        '200':
          description: Minimum refund amount updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/register_merchant:
    post:
      summary: Register a new merchant.
      operationId: registerMerchant
      x-soroban-contract-method: register_merchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMerchantRequest'
