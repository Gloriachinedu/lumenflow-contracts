        '200':
          description: Merchant registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/update_merchant:
    post:
      summary: Update an existing merchant profile.
      operationId: updateMerchant
      x-soroban-contract-method: update_merchant
