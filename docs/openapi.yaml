          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/set_multisig_expiry_duration:
    post:
      summary: Set the multisig payment expiry duration.
      operationId: setMultisigExpiryDuration
      x-soroban-contract-method: set_multisig_expiry_duration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMultisigExpiryDurationRequest'
      responses:
        '200':
          description: Multisig expiry updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/set_refund_window:
    post:
      summary: Set the refund window in seconds.
      operationId: setRefundWindow
      x-soroban-contract-method: set_refund_window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRefundWindowRequest'
      responses:
        '200':
          description: Refund window updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/pause_contract:
    post:
      summary: Pause the contract.
      operationId: pauseContract
      x-soroban-contract-method: pause_contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOnlyRequest'
      responses:
        '200':
          description: Contract paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/unpause_contract:
    post:
      summary: Resume the contract.
      operationId: unpauseContract
      x-soroban-contract-method: unpause_contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminOnlyRequest'
      responses:
        '200':
          description: Contract resumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/set_min_refund_amount:
    post:
      summary: Set the minimum refund amount.
      operationId: setMinRefundAmount
      x-soroban-contract-method: set_min_refund_amount
      requestBody:
        required: true
        content:
          application/json:
            schema:
