          description: Payment summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSummary'
  /contract/update_payment_status:
    post:
      summary: Update a payment status.
      operationId: updatePaymentStatus
      x-soroban-contract-method: update_payment_status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentStatusRequest'
      responses:
        '200':
          description: Payment status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/archive_payment_record:
    post:
      summary: Archive a payment record.
      operationId: archivePaymentRecord
      x-soroban-contract-method: archive_payment_record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StringRequest'
      responses:
        '200':
          description: Payment archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/cleanup_expired_payments:
