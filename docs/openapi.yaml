            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '200':
          description: Merchant profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
  /contract/is_registered:
    post:
      summary: Determine whether a merchant is registered.
      operationId: isRegistered
