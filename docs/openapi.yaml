      responses:
        '200':
          description: Merchant verification removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/get_merchant:
    post:
      summary: Fetch a merchant profile.
      operationId: getMerchant
      x-soroban-contract-method: get_merchant
      requestBody:
        required: true
        content:
