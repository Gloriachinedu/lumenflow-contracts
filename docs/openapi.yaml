openapi: 3.0.3
info:
  title: LumenFlow Soroban Contract API
  version: 1.0.0
  description: |
    Interactive OpenAPI reference for the LumenFlow Soroban payment contract.
    This document mirrors the public contract entrypoints exposed by the Rust contract
    and is designed to be consumed by Swagger UI or similar tooling.

    Soroban transactions are authenticated by transaction signatures rather than a
    bearer token. Each operation below assumes that the caller has already signed the
    transaction with the required source account and that the contract will enforce
    authorization at the host level.
servers:
  - url: https://soroban.stellar.org
    description: Soroban network endpoint for contract invocation
paths:
  /contract/get_contract_version:
    post:
      summary: Get the current contract version.
      operationId: getContractVersion
      x-soroban-contract-method: get_contract_version
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringValue'
  /contract/set_admin:
    post:
      summary: Initialise or replace the contract administrator.
      operationId: setAdmin
      x-soroban-contract-method: set_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAdminRequest'
      responses:
        '200':
          description: Admin updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/transfer_admin:
    post:
      summary: Transfer admin permissions to a new address.
      operationId: transferAdmin
      x-soroban-contract-method: transfer_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferAdminRequest'
      responses:
        '200':
          description: Admin updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/set_payment_cleanup_period:
    post:
      summary: Set the cleanup period for expired records.
      operationId: setPaymentCleanupPeriod
      x-soroban-contract-method: set_payment_cleanup_period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPaymentCleanupPeriodRequest'
      responses:
        '200':
          description: Cleanup period updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/set_platform_fee:
    post:
      summary: Set the platform fee configuration.
      operationId: setPlatformFee
      x-soroban-contract-method: set_platform_fee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPlatformFeeRequest'
      responses:
        '200':
          description: Platform fee updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/set_large_payment_threshold:
    post:
      summary: Set the large-payment event threshold.
      operationId: setLargePaymentThreshold
      x-soroban-contract-method: set_large_payment_threshold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLargePaymentThresholdRequest'
      responses:
        '200':
          description: Threshold updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/add_allowed_token:
    post:
      summary: Allow a token for payments.
      operationId: addAllowedToken
      x-soroban-contract-method: add_allowed_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAllowedTokenRequest'
      responses:
        '200':
          description: Token allow-list updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
  /contract/remove_allowed_token:
    post:
      summary: Remove a token from the allow-list.
      operationId: removeAllowedToken
