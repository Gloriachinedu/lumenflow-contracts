# cargo-audit configuration
# Docs: https://rustsec.org/advisories/
#
# When adding an entry to [advisories.ignore], you MUST include:
#   - id:       the RUSTSEC advisory ID
#   - reason:   why we are ignoring it
#   - expiry:   ISO-8601 date after which the ignore must be re-evaluated
#
# Example:
#   [[advisories.ignore]]
#   id = "RUSTSEC-2023-XXXX"
#   reason = "No upstream fix available; risk mitigated by network isolation."
#   expiry = "2026-12-31"

[advisories]
ignore = []

[database]
# Path for the local advisory database clone.
path = "~/.cargo/advisory-db"
url = "https://github.com/rustsec/advisory-db"
# Fetch a fresh copy of the DB on every run.
fetch = true
# Fail if the DB cannot be fetched (e.g. offline in CI).
stale = "deny"
