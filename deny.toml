# cargo-deny configuration
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Run checks against all targets/features
all-features = false
no-default-features = false

# ---------------------------------------------------------------------------
# Advisories — fail on any known CVE or unmaintained crate
# ---------------------------------------------------------------------------
[advisories]
# The path where the advisory database is cloned/cached.
db-path = "~/.cargo/advisory-db"
# URL(s) for the advisory databases.
db-urls = ["https://github.com/rustsec/advisory-db"]
# Fail the check if any vulnerability advisory is detected.
version = 2
ignore = [
    # Example entry — add real ignores here with justification and expiry:
    # { id = "RUSTSEC-0000-0000", reason = "No fix available; mitigated by X", expiry = "2026-12-31" }
]

# ---------------------------------------------------------------------------
# Licenses — only allow OSI-approved permissive/copyleft licenses
# ---------------------------------------------------------------------------
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]
# Confidence threshold for detecting a license from a license file.
confidence-threshold = 0.8
exceptions = []

[[licenses.clarify]]
# ring has a complex license; clarify it explicitly
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# ---------------------------------------------------------------------------
# Bans — reject duplicate versions and yanked crates
# ---------------------------------------------------------------------------
[bans]
# Deny multiple versions of the same crate unless explicitly allowed.
multiple-versions = "warn"
# Deny wildcard (path/git) dependencies in non-workspace crates.
wildcards = "allow"
# Deny yanked crates.
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources — only allow crates from crates.io and the workspace itself
# ---------------------------------------------------------------------------
[sources]
# Deny crates from unknown registries or unrecognised git sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
