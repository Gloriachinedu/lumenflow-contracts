# cargo-deny configuration
# Used alongside cargo-audit to manage known false positives and advisory exceptions.
# See: https://embarkstudios.github.io/cargo-deny/

[advisories]
# The path where the advisory databases are stored.
db-path = "~/.cargo/advisory-db"

# URL(s) of the advisory databases to use.
db-urls = ["https://github.com/rustsec/advisory-db"]

# The lint level for security vulnerabilities.
vulnerability = "deny"

# The lint level for unmaintained crates.
unmaintained = "warn"

# The lint level for crates that have been yanked from their source registry.
yanked = "warn"

# The lint level for crates with security notices.
notice = "warn"

# Advisories that are explicitly ignored (known false positives).
# Format: "RUSTSEC-YYYY-NNNN"
# Example:
#   ignore = [
#     { id = "RUSTSEC-2020-0001", reason = "Not applicable — we don't use the affected feature" },
#   ]
ignore = []

[licenses]
# Lint level for crates which do not have a detectable license.
unlicensed = "deny"

# List of explicitly allowed licenses.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
]

# Lint level for licenses considered copyleft.
copyleft = "warn"

[bans]
# Lint level for when multiple versions of the same crate are detected.
multiple-versions = "warn"

# Lint level for when a crate version requirement is `*`.
wildcards = "deny"

[sources]
# Lint level for what to happen when a crate from a crate registry that is
# not in the allow list is encountered.
unknown-registry = "deny"

# Lint level for what to happen when a crate from a git repository that is
# not in the allow list is encountered.
unknown-git = "deny"

# List of allowed registries.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
