<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LumenFlow Dashboard</title>
  <script>
    // Apply theme before paint to prevent flash of unstyled content.
    // Uses shared key 'lumenflow_theme' so preference is consistent across all
    // dashboard and frontend pages.
    (function () {
      const stored = localStorage.getItem('lumenflow_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else if (stored === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
    }

    header h1 { font-size: 1.25rem; }

    button#theme-toggle {
      background: var(--color-accent);
      color: var(--color-accent-text);
      border: none;
      border-radius: 0.375rem;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      font-size: 0.875rem;
    }

    main {
      padding: 2rem 1.5rem;
    }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 0.5rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .card h2 { font-size: 1rem; margin-bottom: 0.25rem; }
    .card p  { color: var(--color-text-muted); font-size: 0.875rem; }

    .dashboard-nav { margin-top: 1.5rem; display: flex; gap: 1rem; }
    .dashboard-nav a {
      color: var(--color-accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .dashboard-nav a:hover { text-decoration: underline; }

    .health-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: default;
      background: var(--color-surface);
      color: var(--color-text-muted);
    }

    .health-badge .health-dot {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: var(--color-text-muted);
      flex-shrink: 0;
    }

    .health-badge[data-status="healthy"] .health-dot { background: #22c55e; }
    .health-badge[data-status="degraded"] .health-dot { background: #ef4444; }
    .health-badge[data-status="unknown"] .health-dot { background: #9ca3af; }
  </style>
</head>
<body>
  <header>
    <h1>LumenFlow</h1>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <span id="health-badge" class="health-badge" data-status="unknown" title="Checking dependencies…">
        <span class="health-dot"></span>
        <span id="health-label">Checking…</span>
      </span>
      <button id="theme-toggle">Toggle Dark Mode</button>
    </div>
  </header>
  <main>
    <div class="card">
      <h2>Payments</h2>
      <p>View and manage your payment history.</p>
    </div>
    <div class="card">
      <h2>Merchants</h2>
      <p>Registered merchant profiles.</p>
    </div>
    <div class="card">
      <h2>Refunds</h2>
      <p>Track refund requests and approvals.</p>
    </div>
    <div class="card">
      <h2><a href="onboarding-analytics/index.html">Onboarding Analytics</a></h2>
      <p>Merchant registration funnel — step completion rates, drop-off analysis, and wallet connect outcomes.</p>
    </div>
  </main>
  <script>
    const toggle = document.getElementById('theme-toggle');
    toggle.addEventListener('click', function () {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      // Use shared key so preference syncs with merchant-dashboard and fraud-analytics
      localStorage.setItem('lumenflow_theme', next);
    });

    // Health badge: polls the webhook server's /health endpoint and reflects
    // dependency status in real time. Green when HTTP 200, red when 503.
    (function () {
      const badge = document.getElementById('health-badge');
      const label = document.getElementById('health-label');
      const HEALTH_URL = '/health';
      const POLL_INTERVAL_MS = 15000;

      function describeDependency(name, dep) {
        if (!dep) return name + ': unknown';
        if (dep.ok) {
          return name + ': ok' + (typeof dep.latency_ms === 'number' ? ' (' + dep.latency_ms + 'ms)' : '');
        }
        return name + ': degraded';
      }

      function render(status, data) {
        const healthy = status === 200 && data && data.status === 'ok';
        badge.setAttribute('data-status', healthy ? 'healthy' : 'degraded');
        label.textContent = healthy ? 'Healthy' : 'Degraded';

        const lines = [];
        if (data) {
          lines.push(describeDependency('RPC', data.rpc));
          lines.push(describeDependency('Redis', data.redis));
          lines.push(describeDependency('Webhook Relay', data.webhookRelay));
        } else {
          lines.push('Unable to reach /health');
        }
        badge.title = lines.join('\n');
      }

      async function checkHealth() {
        try {
          const res = await fetch(HEALTH_URL, { cache: 'no-store' });
          let data = null;
          try { data = await res.json(); } catch (e) { data = null; }
          render(res.status, data);
        } catch (err) {
          badge.setAttribute('data-status', 'degraded');
          label.textContent = 'Degraded';
          badge.title = 'Unable to reach /health: ' + err.message;
        }
      }

      checkHealth();
      setInterval(checkHealth, POLL_INTERVAL_MS);
    })();
  </script>
</body>
</html>
