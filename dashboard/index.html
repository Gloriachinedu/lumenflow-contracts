<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LumenFlow Dashboard</title>
  <script>
    // Apply theme before paint to prevent flash of unstyled content.
    // Uses shared key 'lumenflow_theme' so preference is consistent across all
    // dashboard and frontend pages.
    (function () {
      const stored = localStorage.getItem('lumenflow_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else if (stored === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
    }

    header h1 { font-size: 1.25rem; }

    button#theme-toggle {
      background: var(--color-accent);
      color: var(--color-accent-text);
      border: none;
      border-radius: 0.375rem;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      font-size: 0.875rem;
    }

    main {
      padding: 2rem 1.5rem;
    }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 0.5rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .card h2 { font-size: 1rem; margin-bottom: 0.25rem; }
    .card p  { color: var(--color-text-muted); font-size: 0.875rem; }

    .dashboard-nav { margin-top: 1.5rem; display: flex; gap: 1rem; }
    .dashboard-nav a {
      color: var(--color-accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .dashboard-nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>LumenFlow</h1>
    <button id="theme-toggle">Toggle Dark Mode</button>
  </header>
  <main>
    <div class="card">
      <h2>Payments</h2>
      <p>View and manage your payment history.</p>
    </div>
    <div class="card">
      <h2>Merchants</h2>
      <p>Registered merchant profiles.</p>
    </div>
    <div class="card">
      <h2>Refunds</h2>
      <p>Track refund requests and approvals.</p>
    </div>
  </main>
  <script>
    const toggle = document.getElementById('theme-toggle');
    toggle.addEventListener('click', function () {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      // Use shared key so preference syncs with merchant-dashboard and fraud-analytics
      localStorage.setItem('lumenflow_theme', next);
    });
  </script>
</body>
</html>
