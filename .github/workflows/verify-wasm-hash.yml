name: Verify WASM Hash

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Stellar network (testnet or mainnet)'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet
      contract_id:
        description: 'Deployed contract ID (C...)'
        required: true
        type: string
      release_tag:
        description: 'Release tag to verify against (e.g. v0.1.0). Leave blank to build from source.'
        required: false
        default: ''
        type: string

jobs:
  verify:
    name: Verify WASM Hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830  # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master
        with:
          toolchain: 1.87.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v22.8.1/stellar-cli-22.8.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar

      - name: Verify WASM hash
        env:
          CONTRACT_ID: ${{ inputs.contract_id }}
          NETWORK:      ${{ inputs.network }}
          RELEASE_TAG:  ${{ inputs.release_tag }}
        run: |
          chmod +x scripts/verify_wasm_hash.sh
          ./scripts/verify_wasm_hash.sh

      - name: Post verification summary
        if: always()
        run: |
          echo "## WASM Hash Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Network | ${{ inputs.network }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Contract ID | \`${{ inputs.contract_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release Tag | ${{ inputs.release_tag || '(built from source)' }} |" >> "$GITHUB_STEP_SUMMARY"
