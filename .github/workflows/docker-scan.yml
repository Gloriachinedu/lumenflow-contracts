# Container Image Scanning — resolves issue #1336
#
# Builds the Docker image and scans it with Trivy for OS and library CVEs
# before it can be used in any deployment.
#
#   • Critical CVEs  → workflow fails (exit 1)
#   • High CVEs      → warning annotation posted on the PR; workflow continues
#   • Scan results   → uploaded as SARIF to the GitHub Security tab
#
# All third-party actions are pinned to full commit SHAs for supply-chain
# security.  SHA comments identify the human-readable tag at pin time.

name: Docker Image Scan

on:
  push:
    branches: [main, develop]
    paths:
      - '**/Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-scan.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - '**/Dockerfile*'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-scan.yml'
  schedule:
    # Weekly scan of the main branch image (Mondays at 03:00 UTC)
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write   # required to upload SARIF to the Security tab
  pull-requests: write     # required to post warning annotations on PRs
  issues: write            # required to open Dependabot-style issues for HIGH CVEs
=======

jobs:
  docker-scan:
    name: Build and scan Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # -----------------------------------------------------------------------
      # 2. Set up Docker Buildx (required for cache-from/to and multi-platform)
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5730b38e59ac2e97b860e5bba2f4e3e4a28a6b1  # v3.10.0

      # -----------------------------------------------------------------------
      # 3. Build the Docker image
      #    Tag it with a deterministic local name so Trivy can address it.
      # -----------------------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1  # v6.16.0
        with:
          context: .
          push: false
          load: true
          tags: lumenflow:scan-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # 3b. Verify every Dockerfile pins its base image by digest
      #     (FROM ...@sha256:<digest>).  Fails the workflow otherwise.
      # -----------------------------------------------------------------------
      - name: Verify base images are pinned by digest
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' dockerfile; do
            echo "Checking ${dockerfile}"
            # Extract FROM lines, ignoring comments and stage references.
            while IFS= read -r line; do
              image=$(echo "$line" | sed -E 's/^[[:space:]]*FROM[[:space:]]+//I' | awk '{print $1}')
              # Skip references to earlier build stages (no registry/repo path).
              if [[ "$image" == *"@"*"sha256:"* ]]; then
                continue
              fi
              # Allow stage aliases (e.g. FROM builder AS final) only if the
              # referenced name matches a previously declared stage.
              if [[ "$image" != *"/"* && "$image" != *":"* ]]; then
                continue
              fi
              echo "::error file=${dockerfile}::Base image '${image}' is not pinned by digest"
              fail=1
            done < <(grep -iE '^[[:space:]]*FROM[[:space:]]' "$dockerfile" || true)
          done < <(find . -type f -iname 'Dockerfile*' -not -path './.git/*' -print0)
          if [[ "$fail" -ne 0 ]]; then
            echo "One or more Dockerfiles use unpinned base images."
            exit 1
          fi
          echo "All Dockerfiles pin base images by digest."

      # -----------------------------------------------------------------------
      # 4. Trivy scan — SARIF output (uploaded to Security tab)
      #    Severity filter: CRITICAL,HIGH for SARIF (informational record).
      # -----------------------------------------------------------------------
      - name: Scan image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.30.0
        with:
          image-ref: lumenflow:scan-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'   # do not fail here; failure is handled separately below
          ignore-unfixed: false

      # -----------------------------------------------------------------------
      # 5. Upload SARIF to GitHub Security tab
      # -----------------------------------------------------------------------
      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@28deaeda66b76a05916b6923827895f2b14ab96a  # v3.28.16
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container

      # -----------------------------------------------------------------------
      # 6. Trivy scan — table output for Critical CVEs (fails the workflow)
      # -----------------------------------------------------------------------
      - name: Fail on Critical CVEs
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.30.0
        with:
          image-ref: lumenflow:scan-${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'          # hard fail on any Critical finding
          ignore-unfixed: false

      # -----------------------------------------------------------------------
      # 7. Trivy scan — High CVEs produce a warning annotation and open a
      #    Dependabot-style issue.  The step is non-blocking (continue-on-error)
      #    so the workflow itself still succeeds.
      # -----------------------------------------------------------------------
      - name: Warn on High CVEs
        id: high-cves
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.30.0
        continue-on-error: true
        with:
          image-ref: lumenflow:scan-${{ github.sha }}
          format: table
          output: trivy-high.txt
          severity: HIGH
          exit-code: '1'          # non-zero so GitHub shows it as a warning annotation
          ignore-unfixed: false

      # -----------------------------------------------------------------------
      # 8. Open a Dependabot-style issue when HIGH CVEs are found
      # -----------------------------------------------------------------------
      - name: Open issue for High CVEs
        if: steps.high-cves.outcome == 'failure'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            let details = '';
            try {
              details = fs.readFileSync('trivy-high.txt', 'utf8');
            } catch (e) {
              details = 'Trivy reported HIGH severity vulnerabilities (details unavailable).';
            }
            const maxLen = 60000;
            const body = [
              '## Container image HIGH severity vulnerabilities',
              '',
              `Trivy detected HIGH severity CVEs in the image built from \`${context.sha}\`.`,
              '',
              '### Scan results',
              '```',
              details.length > maxLen ? details.slice(0, maxLen) + '\n... (truncated)' : details,
              '```',
              '',
              '### Remediation',
              '- Update the affected base image (pin by digest) or dependencies.',
              '- Re-run the Docker Image Scan workflow after applying fixes.',
              '',
              `_Detected by [Docker Image Scan](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})._`
            ].join('\n');

            const title = `[Security] HIGH severity CVEs in container image (${context.sha.slice(0, 7)})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies',
              per_page: 100
            });
            const duplicate = existing.data.find(i => i.title === title);
            if (duplicate) {
              core.info(`Issue already exists: #${duplicate.number}`);
              return;
            }
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security', 'dependencies']
            });
            core.info(`Opened issue #${issue.data.number}`);
