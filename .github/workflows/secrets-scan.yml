name: Secrets Scanning

# Resolves Issue #627: Add secrets scanning to prevent accidental key commits.
#
# This workflow runs gitleaks on every PR and push to main/develop.
# It fails if any secrets matching .gitleaks.toml rules are detected.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so gitleaks can scan all commits in the PR/push
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use our custom config file
          GITLEAKS_CONFIG: .gitleaks.toml
          # Redact secret values from logs (show rule ID only)
          GITLEAKS_ENABLE_COMMENTS: "true"
