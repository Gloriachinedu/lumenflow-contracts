name: Visual Regression – Dark & Light Mode

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "dashboard/**"
      - "tests/playwright/**"
      - "tests/playwright.config.ts"
      - ".github/workflows/visual-regression.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "dashboard/**"
      - "tests/playwright/**"
      - "tests/playwright.config.ts"
      - ".github/workflows/visual-regression.yml"
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Update baseline screenshots (commits updated PNGs)"
        type: boolean
        default: false

jobs:
  visual-regression:
    name: Visual Regression (dark + light)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true   # needed only when updating snapshots

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Install frontend serve dependency
        run: npm install -g serve@14

      # ── Normal run (compare against baselines) ───────────────────────────────
      - name: Run dark-mode visual regression tests
        if: ${{ !inputs.update_snapshots }}
        working-directory: tests
        run: npm run test:visual:dark-mode
        env:
          CI: "true"
          BASE_URL: "http://localhost:3000"

      # ── Update-snapshot run ───────────────────────────────────────────────────
      - name: Update baseline screenshots
        if: ${{ inputs.update_snapshots }}
        working-directory: tests
        run: npm run test:update-snapshots:dark-mode
        env:
          CI: "false"    # allow existing-server to skip auto-start if needed
          BASE_URL: "http://localhost:3000"

      - name: Commit updated baselines
        if: ${{ inputs.update_snapshots }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/playwright/screenshots/
          git diff --cached --quiet || git commit -m "chore(tests): update dark-mode visual regression baselines [skip ci]"
          git push

      # ── Artifacts on failure ──────────────────────────────────────────────────
      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs-${{ github.run_id }}
          path: |
            tests/playwright-report/
            tests/playwright/screenshots/
          retention-days: 14
          if-no-files-found: ignore
