name: Validate CHANGELOG

on:
  pull_request:
    paths:
      - 'CHANGELOG.md'

jobs:
  validate-changelog:
    name: Validate Keep a Changelog format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830  # v4
        with:
          persist-credentials: false

      - name: Check [Unreleased] section exists
        run: |
          if ! grep -qE '^\s*## \[Unreleased\]' CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md is missing an [Unreleased] section."
            exit 1
          fi
          echo "✓ [Unreleased] section found."

      - name: Check version headers use ISO 8601 dates
        run: |
          # Every versioned section header must match: ## [X.Y.Z] - YYYY-MM-DD
          BAD=$(grep -nE '^\s*## \[[0-9]' CHANGELOG.md | grep -vE '^\s*[0-9]+:\s*## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: The following version headers do not match '## [X.Y.Z] - YYYY-MM-DD':"
            echo "$BAD"
            exit 1
          fi
          echo "✓ All version headers use ISO 8601 dates."

      - name: Check only standard Keep a Changelog categories are used
        run: |
          ALLOWED="Added|Changed|Deprecated|Removed|Fixed|Security"
          BAD=$(grep -nE '^\s*### ' CHANGELOG.md | grep -vE "^\s*[0-9]+:\s*### ($ALLOWED)$" || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: Non-standard category headings found (allowed: Added, Changed, Deprecated, Removed, Fixed, Security):"
            echo "$BAD"
            exit 1
          fi
          echo "✓ All category headings are standard Keep a Changelog categories."

      - name: Check comparison links at the bottom
        run: |
          if ! grep -qE '^\[Unreleased\]:' CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md is missing the [Unreleased] comparison link at the bottom."
            exit 1
          fi
          echo "✓ Comparison links present."
