name: SDK Integration Tests

on:
  # Run weekly on Monday at 06:00 UTC
  schedule:
    - cron: "0 6 * * 1"
  # Allow manual trigger
  workflow_dispatch:

jobs:
  sdk-integration:
    name: SDK Integration Tests (testnet)
    runs-on: ubuntu-latest
    environment: testnet

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci --ignore-scripts

      - name: Run integration tests
        working-directory: sdk
        env:
          TESTNET_RPC_URL: https://soroban-testnet.stellar.org
          TESTNET_CONTRACT_ID: ${{ secrets.TESTNET_CONTRACT_ID }}
          TESTNET_SOURCE_SECRET: ${{ secrets.TESTNET_SOURCE_SECRET }}
        run: npm run test:integration -- --reporters=default --reporters=jest-junit
        continue-on-error: true
        id: run_tests

      - name: Upload test results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-integration-test-results
          path: sdk/junit.xml
          retention-days: 30

      - name: Post results summary to Gist and link in CI summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT="${{ steps.run_tests.outcome }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SUMMARY="SDK integration test run: ${RESULT} at ${TIMESTAMP}"

          # Write a brief summary file
          echo "# SDK Integration Test Results" > integration-summary.md
          echo "" >> integration-summary.md
          echo "**Run outcome:** ${RESULT}" >> integration-summary.md
          echo "**Timestamp:** ${TIMESTAMP}" >> integration-summary.md
          echo "**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> integration-summary.md

          # Post summary to a Gist
          GIST_URL=$(gh gist create integration-summary.md \
            --desc "LumenFlow SDK integration test results — ${TIMESTAMP}" \
            --public \
            --filename "sdk-integration-results-${TIMESTAMP}.md" 2>/dev/null || echo "")

          # Write to the GitHub Actions step summary
          echo "## SDK Integration Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Outcome:** ${RESULT}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Timestamp:** ${TIMESTAMP}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$GIST_URL" ]; then
            echo "**Results Gist:** ${GIST_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
