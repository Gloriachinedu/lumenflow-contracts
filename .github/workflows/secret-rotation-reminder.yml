name: Quarterly Secret Rotation Reminder

# Runs at 09:00 UTC on the first day of Jan, Apr, Jul, Oct (quarterly)
on:
  schedule:
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  create-rotation-reminder:
    name: Create Secret Rotation Reminder Issue
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create rotation reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const quarter = Math.ceil((new Date().getMonth() + 1) / 3);
            const year = new Date().getFullYear();

            const body = [
              `## 🔑 Quarterly Secret Rotation Reminder — Q${quarter} ${year}`,
              '',
              'This issue is automatically created every quarter to remind maintainers to rotate',
              'all long-lived GitHub Actions secrets per the [credential separation guide](../blob/main/docs/credential-separation.md).',
              '',
              '**Due date:** Within 14 days of this issue opening (' + today + ').',
              '',
              '### Testnet secrets',
              '',
              '- [ ] `TESTNET_DEPLOYER_KEY` — Stellar secret key for the testnet deploy account',
              '- [ ] `TESTNET_ADMIN_KEY` — Stellar secret key for the testnet contract admin',
              '- [ ] `TESTNET_MERCHANT_KEY` — Stellar secret key for smoke-test merchant',
              '- [ ] `TESTNET_PAYER_KEY` — Stellar secret key for smoke-test payer',
              '- [ ] `TESTNET_TOKEN_ADDRESS` — SAC token address for smoke tests (verify still valid)',
              '- [ ] `TESTNET_ADMIN_ADDRESS` — Public address of the testnet admin (verify matches new key)',
              '- [ ] `TESTNET_MERCHANT_ADDRESS` — Public address of testnet merchant (verify matches new key)',
              '- [ ] `TESTNET_PAYER_ADDRESS` — Public address of testnet payer (verify matches new key)',
              '- [ ] `TESTNET_SOURCE_ACCOUNT` — Source account for rollback operations',
              '',
              '### Mainnet secrets',
              '',
              '- [ ] `MAINNET_DEPLOYER_KEY` — Stellar secret key for the mainnet deploy account',
              '- [ ] `MAINNET_ADMIN_KEY` — Stellar secret key for the mainnet contract admin',
              '- [ ] `MAINNET_SOURCE_ACCOUNT` — Source account for mainnet operations',
              '- [ ] `MAINNET_ADMIN_ADDRESS` — Public address of the mainnet admin (verify matches new key)',
              '',
              '### Rotation procedure',
              '',
              '1. Generate a new key for the affected network only.',
              '2. Fund the new key on the target network.',
              '3. Update the GitHub Actions secret (`Settings → Secrets → Actions`).',
              '4. Verify the relevant workflow runs successfully with the new key.',
              '5. Revoke the old key by draining its XLM balance and abandoning it.',
              '',
              '> ⚠️ **Never copy a key from testnet to mainnet or vice versa.**',
              '',
              'See [docs/credential-separation.md](../blob/main/docs/credential-separation.md) and',
              '[docs/secrets-and-local-env.md](../blob/main/docs/secrets-and-local-env.md) for full guidance.',
              '',
              '---',
              '_This issue was automatically generated by the `secret-rotation-reminder.yml` workflow._',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore: Q${quarter} ${year} secret rotation reminder`,
              body,
              labels: ['security', 'maintenance'],
              assignees: ['Gloriachinedu'],
            });
