name: Release

# Triggered when a semver tag (e.g. v1.2.3, v1.2.3-rc.1) is pushed.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate Tag & Version Alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830  # v4
        with:
          persist-credentials: false

      # Ensure the pushed tag matches the version in contracts/lumenflow/Cargo.toml
      - name: Check contract version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"   # strip leading "v"
          CARGO_VER=$(grep '^version' contracts/lumenflow/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          echo "Tag version  : $TAG"
          echo "Cargo version: $CARGO_VER"
          if [ "$TAG" != "$CARGO_VER" ]; then
            echo "ERROR: tag v$TAG does not match Cargo.toml version $CARGO_VER" >&2
            exit 1
          fi

      # Ensure the pushed tag matches the version in sdk/package.json
      - name: Check SDK version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SDK_VER=$(node -p "require('./sdk/package.json').version")
          echo "Tag version: $TAG"
          echo "SDK version: $SDK_VER"
          if [ "$TAG" != "$SDK_VER" ]; then
            echo "ERROR: tag v$TAG does not match sdk/package.json version $SDK_VER" >&2
            exit 1
          fi

  changelog:
    name: Generate & Commit CHANGELOG
    runs-on: ubuntu-latest
    needs: validate-tag
    outputs:
      changelog_body: ${{ steps.extract.outputs.body }}
    steps:
      # Need full history so conventional-changelog can walk all commits since the last tag
      - uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830  # v4
        with:
          fetch-depth: 0
          # credentials are required so we can push the changelog commit back
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8  # v4.0.2
        with:
          node-version: "20"

      - name: Install conventional-changelog-cli
        run: npm install --no-save conventional-changelog-cli@5.0.0

      - name: Generate CHANGELOG.md
        run: |
          # -p conventionalcommits  – use the conventional-commits preset
          # -i / -s                 – read from and write to CHANGELOG.md in place
          # -r 0                    – regenerate the full changelog, not just the latest tag
          # --config                – custom grouping/transform defined in changelog.config.js
          node_modules/.bin/conventional-changelog \
            -p conventionalcommits \
            -i CHANGELOG.md \
            -s \
            -r 0 \
            --config changelog.config.js

      - name: Extract release section for release notes
        id: extract
        run: |
          # Pull out everything between the first and second "## [" headers
          # so we can embed it in the GitHub Release body.
          BODY=$(awk '/^## \[/{found++} found==1{print} found==2{exit}' CHANGELOG.md)
          # Store as a multi-line output (GitHub Actions supports this via delimiter)
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit updated CHANGELOG.md
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit if the file actually changed
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date — nothing to commit."
          else
            # Push the commit to the branch that the tag points at (usually main)
            BRANCH=$(git branch -r --contains "$GITHUB_REF_NAME" \
                       | grep -v HEAD \
                       | sed 's|origin/||' \
                       | head -1 \
                       | tr -d ' ')
            git checkout "$BRANCH"
            git add CHANGELOG.md
            git commit -m "docs(changelog): update for ${{ github.ref_name }} [skip ci]"
            git push origin "$BRANCH"
          fi

  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    needs: changelog
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830  # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # master
        with:
          toolchain: 1.87.0
          targets: wasm32-unknown-unknown

      - name: Verify toolchain version
        run: rustc --version | grep "1.87.0"

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Validate tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version' contracts/lumenflow/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version:   $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Build WASM (release)
        run: |
          cargo build --locked \
            --target wasm32-unknown-unknown \
            --release \
            --package lumenflow \
            --locked

      - name: Compute SHA-256 hash
        id: hash
        run: |
          HASH=$(sha256sum target/wasm32-unknown-unknown/release/lumenflow.wasm | awk '{print $1}')
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "## WASM Hash" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $HASH" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Published SHA-256: $HASH"

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v22.8.1/stellar-cli-22.8.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar

      - name: Verify WASM artifact
        run: |
          WASM=target/wasm32-unknown-unknown/release/lumenflow.wasm

          # Non-zero size check
          SIZE=$(wc -c < "$WASM")
          if [ "$SIZE" -eq 0 ]; then
            echo "::error::WASM artifact is empty"
            exit 1
          fi
          echo "WASM size: ${SIZE} bytes"

          # Soroban 128 KB limit (131072 bytes); CI threshold is 100 KB
          if [ "$SIZE" -gt 102400 ]; then
            echo "::error::WASM size ${SIZE} exceeds 100 KB CI threshold"
            exit 1
          fi

          # Validate contract and log exported functions
          echo "### WASM Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: ${SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Exported functions" >> "$GITHUB_STEP_SUMMARY"
          stellar contract inspect --wasm "$WASM" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rename artifact
        run: |
          cp target/wasm32-unknown-unknown/release/lumenflow.wasm \
             lumenflow_${{ github.ref_name }}.wasm

      - name: Write SHA-256 checksum file
        run: |
          echo "${{ steps.hash.outputs.sha256 }}  lumenflow_${{ github.ref_name }}.wasm" \
            > lumenflow_${{ github.ref_name }}.wasm.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          files: |
            lumenflow_${{ github.ref_name }}.wasm
            lumenflow_${{ github.ref_name }}.wasm.sha256
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body: |
            ${{ needs.changelog.outputs.changelog_body }}

            ---

            ## WASM Verification

            To verify the WASM binary, run:
            ```bash
            VERSION=${{ github.ref_name }} ./scripts/verify-build.sh
            ```

            **SHA-256:** `${{ steps.hash.outputs.sha256 }}`

            See [docs/release-hashes.md](docs/release-hashes.md) for the full hash table and verification instructions.
