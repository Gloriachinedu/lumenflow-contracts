name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ── Build WASM contract ──────────────────────────────────────────────────────
  release-wasm:
    name: Build & Release WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830  # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Validate tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version' contracts/lumenflow/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Tag version:   $TAG_VERSION"
          echo "Cargo version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

      - name: Build WASM (release)
        run: |
          cargo build \
            --target wasm32-unknown-unknown \
            --release \
            --package lumenflow

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v22.8.1/stellar-cli-22.8.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar

      - name: Verify WASM artifact
        run: |
          WASM=target/wasm32-unknown-unknown/release/lumenflow.wasm

          # Non-zero size check
          SIZE=$(wc -c < "$WASM")
          if [ "$SIZE" -eq 0 ]; then
            echo "::error::WASM artifact is empty"
            exit 1
          fi
          echo "WASM size: ${SIZE} bytes"

          # Soroban 128 KB limit (131072 bytes); CI threshold is 100 KB
          if [ "$SIZE" -gt 102400 ]; then
            echo "::error::WASM size ${SIZE} exceeds 100 KB CI threshold"
            exit 1
          fi

          # Validate contract and log exported functions
          echo "### WASM Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: ${SIZE} bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "#### Exported functions" >> "$GITHUB_STEP_SUMMARY"
          stellar contract inspect --wasm "$WASM" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rename artifact
        run: |
          cp target/wasm32-unknown-unknown/release/lumenflow.wasm \
             lumenflow_${{ github.ref_name }}.wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45c66b  # v4.6.0
        with:
          name: wasm-artifact
          path: lumenflow_${{ github.ref_name }}.wasm

  # ── Build CLI binaries (matrix) ──────────────────────────────────────────────
  build-cli:
    name: Build CLI — ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            ext: .exe

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830  # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-cli-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross == true
        run: cargo install cross --locked --version 0.2.5

      - name: Build CLI binary
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --package lumenflow-cli --target ${{ matrix.target }}
          else
            cargo build --release --package lumenflow-cli --target ${{ matrix.target }}
          fi

      - name: Package binary (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BINARY_NAME="lumenflow-cli"
          ARCHIVE_NAME="${BINARY_NAME}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          BINARY_PATH="target/${{ matrix.target }}/release/${BINARY_NAME}"

          # Compute checksum
          sha256sum "${BINARY_PATH}" | awk '{print $1}' > "${BINARY_NAME}.sha256"

          # Create archive containing the binary and checksum
          tar -czf "${ARCHIVE_NAME}" \
            -C "target/${{ matrix.target }}/release" "${BINARY_NAME}" \
            -C "$GITHUB_WORKSPACE" "${BINARY_NAME}.sha256"

          # Compute archive checksum
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Package binary (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $BinaryName = "lumenflow-cli"
          $ArchiveName = "$BinaryName-${{ github.ref_name }}-${{ matrix.target }}.zip"
          $BinaryPath = "target\${{ matrix.target }}\release\$BinaryName.exe"

          # Compute checksum
          $Hash = (Get-FileHash -Algorithm SHA256 $BinaryPath).Hash.ToLower()
          Set-Content -Path "$BinaryName.sha256" -Value $Hash

          # Create zip archive
          Compress-Archive -Path $BinaryPath, "$BinaryName.sha256" -DestinationPath $ArchiveName

          # Compute archive checksum
          $ArchiveHash = (Get-FileHash -Algorithm SHA256 $ArchiveName).Hash.ToLower()
          Set-Content -Path "$ArchiveName.sha256" -Value $ArchiveHash

          echo "ARCHIVE_NAME=$ArchiveName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload CLI artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45c66b  # v4.6.0
        with:
          name: cli-${{ matrix.target }}
          path: |
            lumenflow-cli-${{ github.ref_name }}-${{ matrix.target }}.*

  # ── Create GitHub Release ────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [release-wasm, build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830  # v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444306234f55fbc14849e1ad  # v4.1.8
        with:
          path: artifacts

      - name: Flatten artifact directories
        run: |
          mkdir -p release-assets
          find artifacts -type f | xargs -I{} cp {} release-assets/
          ls -lh release-assets/

      - name: Extract release notes from CHANGELOG.md
        id: release-notes
        run: |
          # Extract section for the current tag (e.g., ## [1.2.3])
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[${TAG_VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](CHANGELOG.md) for full details."
          fi
          # Write to a file to avoid escaping issues
          echo "$NOTES" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: release-assets/*
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
