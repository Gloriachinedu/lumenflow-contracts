name: Accessibility Audit

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'tests/playwright/**'
      - '.github/workflows/a11y.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'tests/playwright/**'
      - '.github/workflows/a11y.yml'
  # Weekly full accessibility report every Monday at 08:00 UTC
  schedule:
    - cron: '0 8 * * 1'

jobs:
  a11y:
    name: Playwright Accessibility Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run accessibility audit
        run: npm run test:a11y
        continue-on-error: false

      # On scheduled weekly runs, also generate the full HTML report
      - name: Generate full accessibility report (weekly)
        if: github.event_name == 'schedule'
        run: npm run test:a11y:report

      - name: Upload accessibility report (weekly)
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 90
