###############################################################################
# PR Preview Deployments – closes #585
#
# Deploys frontend/ to a unique Netlify preview URL on every PR that touches
# frontend/ files.  The URL is posted as a PR comment.
# The preview is torn down when the PR is closed or merged.
###############################################################################
name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "frontend/**"

permissions:
  contents: read
  pull-requests: write  # post / update PR comments

jobs:
  deploy-preview:
    name: Deploy preview to Netlify
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'

    steps:
      - uses: actions/checkout@v4

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@17.x --prefer-offline

      - name: Deploy to Netlify (preview)
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          OUTPUT=$(netlify deploy \
            --dir frontend \
            --alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} – ${{ github.event.pull_request.title }}" \
            --json 2>&1)

          echo "$OUTPUT"

          DEPLOY_URL=$(echo "$OUTPUT" | jq -r '.deploy_url // .url')
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Post preview URL as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const deployUrl = '${{ steps.netlify.outputs.deploy_url }}';
            const prNumber  = context.issue.number;

            // Find and update an existing bot comment, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: prNumber,
            });

            const marker    = '<!-- lumenflow-preview-bot -->';
            const existing  = comments.find(c => c.body.includes(marker));

            const body = `${marker}
            ## 🔍 Frontend Preview Deployment

            | | |
            |---|---|
            | **Preview URL** | [${deployUrl}](${deployUrl}) |
            | **Network**     | Testnet |
            | **Contract ID** | \`${{ secrets.PREVIEW_CONTRACT_ID || 'demo-mode' }}\` |
            | **Commit**      | ${{ github.event.pull_request.head.sha }} |
            | **Status**      | ✅ Live |

            > Preview uses a dedicated testnet contract ID and is publicly accessible.
            > It will be automatically removed when this PR is closed or merged.`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:       context.repo.owner,
                repo:        context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  teardown-preview:
    name: Tear down preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'

    steps:
      - uses: actions/checkout@v4

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@17.x --prefer-offline

      - name: Delete Netlify deploy alias
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          ALIAS="pr-${{ github.event.pull_request.number }}"
          # List all deploys, find the one matching the alias, and lock/delete it
          DEPLOY_ID=$(netlify api listSiteDeploys \
            --data '{"site_id":"'"$NETLIFY_SITE_ID"'"}' \
            | jq -r --arg alias "$ALIAS" \
              '.[] | select(.deploy_ssl_url | contains($alias)) | .id' \
            | head -1)

          if [ -n "$DEPLOY_ID" ]; then
            netlify api deleteDeploy --data '{"deploy_id":"'"$DEPLOY_ID"'"}'
            echo "Deleted deploy $DEPLOY_ID for alias $ALIAS"
          else
            echo "No deploy found for alias $ALIAS – nothing to delete."
          fi

      - name: Update PR comment to reflect teardown
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: prNumber,
            });

            const marker   = '<!-- lumenflow-preview-bot -->';
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body: `${marker}
            ## 🔍 Frontend Preview Deployment

            | | |
            |---|---|
            | **Status** | 🗑️ Removed (PR closed/merged) |
            | **Commit** | ${{ github.event.pull_request.head.sha }} |`,
              });
            }
