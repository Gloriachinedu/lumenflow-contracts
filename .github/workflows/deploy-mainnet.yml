name: Deploy to Mainnet

# Mainnet deploys are gated behind a mandatory human approval step.
# Only the `release/*` and `main` branches can trigger this workflow.
# Two approvals are required before the deploy job runs (enforced via
# GitHub Environments with required reviewers configured in repo settings).
#
# Required GitHub Environment: "mainnet"
#   - Set at: Settings → Environments → mainnet → Required reviewers
#   - Add at least 2 maintainers as required reviewers
#   - Enable "Prevent self-review" for the approval gate
#
# Required secrets (in the "mainnet" environment scope):
#   MAINNET_DEPLOYER_KEY, MAINNET_ADMIN_KEY, MAINNET_SOURCE_ACCOUNT,
#   MAINNET_ADMIN_ADDRESS

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for this mainnet deploy"
        required: true
        type: string
      skip_smoke:
        description: "Skip post-deploy smoke test (emergency deploys only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  id-token: write

# Never cancel an in-progress mainnet deploy.
concurrency:
  group: deploy-mainnet
  cancel-in-progress: false

jobs:
  # ── Pre-flight checks ────────────────────────────────────────────────────────
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd7ee9c9d0e2c3b1a0e5 # master
        with:
          toolchain: 1.87.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mainnet-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mainnet-

      - name: Build WASM (release)
        run: |
          cargo build --target wasm32-unknown-unknown --release --package lumenflow
          WASM_SIZE=$(wc -c < target/wasm32-unknown-unknown/release/lumenflow.wasm)
          echo "WASM size: $WASM_SIZE bytes"
          if [[ "$WASM_SIZE" -gt 102400 ]]; then
            echo "::error::WASM size $WASM_SIZE exceeds 100 KB limit"
            exit 1
          fi

      - name: Run full test suite
        run: cargo test --all-features

      - name: Record deploy metadata
        run: |
          echo "## Pre-flight Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Triggered by:** @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Reason:** ${{ inputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Skip smoke test:** ${{ inputs.skip_smoke }}" >> "$GITHUB_STEP_SUMMARY"

  # ── Audit readiness gate ─────────────────────────────────────────────────────
  # Runs scripts/audit-readiness-check.sh --mainnet as a BLOCKING step.
  # The workflow fails immediately if any Critical or High audit findings are
  # unresolved, preventing the human approval gate from being triggered at all.
  audit-readiness:
    name: Audit Readiness Check (Blocking)
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run audit readiness check (mainnet, blocking)
        run: |
          chmod +x scripts/audit-readiness-check.sh
          ./scripts/audit-readiness-check.sh --mainnet
          echo "## ✅ Audit Readiness Check Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "No Critical or High findings blocking mainnet deployment." >> "$GITHUB_STEP_SUMMARY"

  # ── Automated approval gates ─────────────────────────────────────────────────
  # Enforces the checklist in docs/mainnet-approval-gates.md automatically:
  #   (a) release notes must link to an audit report
  #   (b) a successful testnet smoke test must have run within the last 24h
  #       on the same commit SHA (or on develop)
  validate-gates:
    name: Validate Mainnet Approval Gates
    runs-on: ubuntu-latest
    needs: audit-readiness
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify audit report is linked in release notes
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Fetch release notes for the current tag/ref. Fall back to the
          # annotated tag message if no GitHub release exists.
          NOTES=""
          if gh release view "$REF_NAME" --json body --jq '.body' > /tmp/release-notes.md 2>/dev/null; then
            NOTES=$(cat /tmp/release-notes.md)
          else
            echo "::warning::No GitHub release found for '$REF_NAME'; falling back to tag message"
            NOTES=$(git tag -l --format='%(contents)' "$REF_NAME" 2>/dev/null || true)
          fi

          if [[ -z "$NOTES" ]]; then
            echo "::error::No release notes found for '$REF_NAME'. Cannot verify audit report link."
            exit 1
          fi

          # Match a markdown link whose text or URL path contains 'audit'.
          AUDIT_LINK=$(printf '%s\n' "$NOTES" \
            | grep -Eoi '\[[^]]*audit[^]]*\]\([^)]+\)|\[[^]]+\]\([^)]*audit[^)]*\)' \
            | head -n1 || true)

          if [[ -z "$AUDIT_LINK" ]]; then
            echo "::error::Release notes for '$REF_NAME' do not link to an audit report."
            echo "::error::Add a markdown link such as [Audit Report](https://.../audit-....pdf) to the release notes."
            exit 1
          fi

          AUDIT_URL=$(printf '%s' "$AUDIT_LINK" | sed -E 's/.*\]\(([^)]+)\).*/\1/')
          echo "audit_link=$AUDIT_URL" >> "$GITHUB_OUTPUT"
          echo "## ✅ Audit Report Linked" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: \`$REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Audit report: $AUDIT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify recent testnet smoke test passed
        id: smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')

          gh api "repos/${REPO}/actions/workflows/testnet-smoke.yml/runs?status=success&per_page=20" \
            > /tmp/smoke-runs.json

          # Qualifying runs: successful, completed within the last 24h, and on
          # the same commit SHA or on the develop branch.
          QUALIFYING=$(jq -r --arg cutoff "$CUTOFF" --arg sha "$COMMIT_SHA" '
            [ .workflow_runs[]
              | select(.conclusion == "success")
              | select(.updated_at >= $cutoff)
              | select(.head_sha == $sha or .head_branch == "develop")
            ]
            | sort_by(.updated_at)
            | reverse
            | .[]
            | "\(.html_url)\t\(.head_sha)\t\(.head_branch)\t\(.updated_at)"
          ' /tmp/smoke-runs.json)

          if [[ -z "$QUALIFYING" ]]; then
            echo "::error::No successful testnet smoke test run found in the last 24 hours on commit $COMMIT_SHA or on develop."
            echo "::error::Run the testnet smoke workflow (testnet-smoke.yml) and re-trigger this deploy."
            exit 1
          fi

          # Capture the most recent qualifying run URL and all qualifying URLs.
          LATEST_URL=$(printf '%s\n' "$QUALIFYING" | head -n1 | cut -f1)
          ALL_URLS=$(printf '%s\n' "$QUALIFYING" | cut -f1 | paste -sd ',' -)
          echo "smoke_run_url=$LATEST_URL" >> "$GITHUB_OUTPUT"
          echo "smoke_run_urls=$ALL_URLS" >> "$GITHUB_OUTPUT"

          echo "## ✅ Recent Testnet Smoke Test Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Qualifying runs (last 24h, commit \`$COMMIT_SHA\` or \`develop\`):" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$QUALIFYING" | while IFS=$'\t' read -r url sha branch updated; do
            echo "- $url (commit \`$sha\`, branch \`$branch\`, $updated)" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Write gates.json
        env:
          AUDIT_LINK: ${{ steps.audit.outputs.audit_link }}
          SMOKE_RUN_URL: ${{ steps.smoke.outputs.smoke_run_url }}
          SMOKE_RUN_URLS: ${{ steps.smoke.outputs.smoke_run_urls }}
        run: |
          set -euo pipefail
          jq -n \
            --arg audit_link "$AUDIT_LINK" \
            --arg smoke_run_url "$SMOKE_RUN_URL" \
            --arg smoke_run_urls "$SMOKE_RUN_URLS" \
            --arg commit "${{ github.sha }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg validated_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{
              audit_report_link: $audit_link,
              testnet_smoke_run_url: $smoke_run_url,
              testnet_smoke_run_urls: ($smoke_run_urls | split(",")),
              commit: $commit,
              ref: $ref,
              validated_at: $validated_at
            }' > gates.json
          cat gates.json

      - name: Upload gates.json
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-gates-${{ github.run_id }}
          path: gates.json
          retention-days: 90

  # ── Human approval gate ──────────────────────────────────────────────────────
  # This job uses the "mainnet-production" GitHub Environment which MUST be
  # configured with protection rules in repo settings:
  #   Settings → Environments → mainnet-production → Required reviewers
  #     - Add at least 2 maintainers as required reviewers
  #     - Enable "Prevent self-review"
  # The deploy job below will not run until the environment is approved by the
  # required reviewers. The audit-readiness and validate-gates jobs must pass
  # before approval can be requested.
  await-approval:
    name: Await Mainnet Approval
    runs-on: ubuntu-latest
    needs: validate-gates
    timeout-minutes: 1440  # 24 hours — expire unapproved deploys
    permissions:
      contents: read
      actions: read
    environment:
      name: mainnet-production

    steps:
      - name: Capture approval metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          AUDIT_LINK: ${{ needs.validate-gates.outputs.audit_link }}
          SMOKE_RUN_URLS: ${{ needs.validate-gates.outputs.smoke_run_urls }}
        run: |
          set -euo pipefail
          # Query the environment approval metadata for this workflow run.
          gh api "repos/${REPO}/actions/runs/${RUN_ID}/approvals" > /tmp/approvals.json 2>/dev/null || echo '[]' > /tmp/approvals.json

          # Extract distinct approver logins and their approval timestamps.
          APPROVERS=$(jq -r '
            [ .[] | select(.state == "approved") ]
            | map({ login: .user.login, approved_at: .created_at })
            | unique_by(.login)
          ' /tmp/approvals.json)

          APPROVER_COUNT=$(printf '%s' "$APPROVERS" | jq 'length')
          if [[ "$APPROVER_COUNT" -lt 2 ]]; then
            echo "::error::Fewer than 2 distinct approvers recorded ($APPROVER_COUNT)."
            echo "::error::Ensure the 'mainnet-production' environment requires 2 maintainer approvals."
            exit 1
          fi

          APPROVER_NAMES=$(printf '%s' "$APPROVERS" | jq -r '.[].login' | paste -sd ',' -)
          echo "approvers=$APPROVER_NAMES" >> "$GITHUB_OUTPUT"

          echo "## ✅ Approval Gate Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "### Approvers" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$APPROVERS" | jq -r '.[] | "- @\(.login) — approved at \(.approved_at)"' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Audit Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- $AUDIT_LINK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Qualifying Testnet Smoke Test Runs" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$SMOKE_RUN_URLS" | tr ',' '\n' | while read -r url; do
            [[ -n "$url" ]] && echo "- $url" >> "$GITHUB_STEP_SUMMARY"
          done

          # Persist the deploy log for downstream jobs and as an artifact.
          jq -n \
            --argjson approvers "$APPROVERS" \
            --arg audit_link "$AUDIT_LINK" \
            --arg smoke_run_urls "$SMOKE_RUN_URLS" \
            --arg commit "${{ github.sha }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg captured_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{
              approvers: $approvers,
              audit_report_link: $audit_link,
              testnet_smoke_run_urls: ($smoke_run_urls | split(",")),
              commit: $commit,
              ref: $ref,
              captured_at: $captured_at
            }' > deploy-log.json
          cat deploy-log.json

      - name: Upload deploy-log.json
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-deploy-log-${{ github.run_id }}
          path: deploy-log.json
          retention-days: 90

  # ── Mainnet deploy ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Mainnet
    runs-on: ubuntu-latest
    needs: [await-approval, validate-gates]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd7ee9c9d0e2c3b1a0e5 # master
        with:
          toolchain: 1.87.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mainnet-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mainnet-

      - name: Install Stellar CLI
        run: |
          curl -fsSL \
            https://github.com/stellar/stellar-cli/releases/download/v22.8.1/stellar-cli-22.8.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar

      # ── Service worker cache versioning ───────────────────────────────────────
      # Inject the Git SHA into frontend/sw.js so the production service worker
      # cache name is unique per release (lf-cache-v<sha>). This prevents stale
      # assets from a previous deployment being served, which would break
      # payment flows that depend on updated contract ABIs.
      - name: Inject BUILD_HASH into service worker
        env:
          BUILD_HASH: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! -f frontend/sw.js ]]; then
            echo "::error::frontend/sw.js not found"
            exit 1
          fi
          if ! grep -q '__BUILD_HASH__' frontend/sw.js; then
            echo "::error::frontend/sw.js does not contain the __BUILD_HASH__ placeholder"
            exit 1
          fi
          sed -i "s/__BUILD_HASH__/${BUILD_HASH}/g" frontend/sw.js
          if grep -q '__BUILD_HASH__' frontend/sw.js; then
            echo "::error::Failed to replace __BUILD_HASH__ in frontend/sw.js"
            exit 1
          fi
          echo "Injected BUILD_HASH=${BUILD_HASH} into frontend/sw.js"
          echo "## 🔄 Service Worker Cache Version" >> "$GITHUB_STEP_SUMMARY"
          echo "Cache name: \`lf-cache-v${BUILD_HASH}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy contract to mainnet
        id: deploy
        env:
          NETWORK: mainnet
          SOURCE_ACCOUNT: ${{ secrets.MAINNET_DEPLOYER_KEY }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy.sh
          CONTRACT_ID=$(bash scripts/deploy.sh)

          if [[ -z "$CONTRACT_ID" ]]; then
            echo "::error::Deploy script did not output a contract ID"
            exit 1
          fi

          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"
          echo "## ✅ Mainnet Deploy Succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "Contract ID: \`$CONTRACT_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      # ── Post-deploy smoke test (skippable for emergency deploys) ──────────────
      - name: Run post-deploy smoke test
        id: smoke
        if: inputs.skip_smoke == 'false'
        env:
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
          ADMIN_KEY: ${{ secrets.MAINNET_ADMIN_KEY }}
          ADMIN_ADDRESS: ${{ secrets.MAINNET_ADMIN_ADDRESS }}
          NETWORK: mainnet
        run: |
          set -euo pipefail
          chmod +x scripts/smoke_test.sh
          mkdir -p smoke-results
          if bash scripts/smoke_test.sh 2>&1 | tee smoke-results/smoke-mainnet.log; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
            echo "## ✅ Mainnet smoke test passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
            echo "## ❌ Mainnet smoke test FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload smoke test results
        if: always() && inputs.skip_smoke == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mainnet-smoke-results-${{ github.run_id }}
          path: smoke-results/
          retention-days: 90

      # ── Automated rollback on smoke test failure ──────────────────────────────
      # Invokes rollback.sh when the smoke test returns non-zero.
      # The step is idempotent: rollback.sh is safe to re-run because it only
      # calls set_active_slot on the router (a single atomic storage write) and
      # guards against rolling back to an unconfigured slot.
      - name: Auto-rollback on smoke test failure
        id: auto_rollback
        if: failure() && steps.smoke.conclusion == 'failure' && steps.deploy.outputs.contract_id != ''
        env:
          NETWORK: mainnet
          SOURCE_ACCOUNT: ${{ secrets.MAINNET_SOURCE_ACCOUNT }}
          ROUTER_CONTRACT_ID: ${{ secrets.MAINNET_ROUTER_CONTRACT_ID }}
          ADMIN_ADDRESS: ${{ secrets.MAINNET_ADMIN_ADDRESS }}
        run: |
          set -euo pipefail
          echo "::error::Mainnet smoke test failed — triggering automated rollback"
          chmod +x scripts/rollback.sh

          # Capture rollback output for the step summary
          mkdir -p smoke-results
          ROLLBACK_EXIT=0
          bash scripts/rollback.sh 2>&1 | tee smoke-results/rollback-mainnet.log || ROLLBACK_EXIT=$?

          if [[ $ROLLBACK_EXIT -eq 0 ]]; then
            echo "rollback_result=success" >> "$GITHUB_OUTPUT"
            echo "## ⏪ Auto-rollback SUCCEEDED" >> "$GITHUB_STEP_SUMMARY"
            echo "The deployment was automatically rolled back after smoke test failure." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Smoke test log:** see artifact \`mainnet-smoke-results-${{ github.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Next steps:**" >> "$GITHUB_STEP_SUMMARY"
            echo "1. Inspect the smoke test log for the root cause." >> "$GITHUB_STEP_SUMMARY"
            echo "2. Fix the issue and create a new release." >> "$GITHUB_STEP_SUMMARY"
            echo "3. Do NOT re-deploy until the smoke test passes on testnet." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rollback_result=failed" >> "$GITHUB_OUTPUT"
            echo "## 🚨 Auto-rollback FAILED — MANUAL INTERVENTION REQUIRED" >> "$GITHUB_STEP_SUMMARY"
            echo "rollback.sh exited with code $ROLLBACK_EXIT. Review the rollback log in artifact \`mainnet-smoke-results-${{ github.run_id }}\`." >> "$GITHUB_STEP_SUMMARY"
            # Fallback: pause the contract to stop live traffic
            stellar contract invoke \
              --id "${{ steps.deploy.outputs.contract_id }}" \
              --network mainnet \
              --source-account "$SOURCE_ACCOUNT" \
              -- pause_contract \
              --admin "$ADMIN_ADDRESS" \
              || echo "::warning::Pause also failed — immediate manual intervention required"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Attempted to pause the contract as a fallback." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload rollback log
        if: always() && steps.auto_rollback.conclusion != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mainnet-rollback-results-${{ github.run_id }}
          path: smoke-results/rollback-mainnet.log
          retention-days: 90

      - name: Notify Slack — auto-rollback triggered
        if: steps.auto_rollback.conclusion != 'skipped'
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          payload: |
            {
              "text": "⏪ *Mainnet auto-rollback triggered after smoke test failure*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "⏪ *Mainnet auto-rollback triggered*\n*Result:* `${{ steps.auto_rollback.outputs.rollback_result }}`\n*Contract:* `${{ steps.deploy.outputs.contract_id }}`\n*Commit:* `${{ github.sha }}`\n*Triggered by:* @${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run — inspect rollback log>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — mainnet deploy succeeded
        if: success()
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          payload: |
            {
              "text": "✅ *Mainnet deploy succeeded*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Mainnet deploy succeeded*\n*Contract:* `${{ steps.deploy.outputs.contract_id }}`\n*Commit:* `${{ github.sha }}`\n*Reason:* ${{ inputs.reason }}\n*Approved by:* @${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Slack — mainnet deploy FAILED
        if: failure()
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          payload: |
            {
              "text": "🚨 *MAINNET DEPLOY FAILED — IMMEDIATE ATTENTION REQUIRED*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🚨 *Mainnet deploy FAILED*\n*Contract:* `${{ steps.deploy.outputs.contract_id || 'not deployed' }}`\n*Commit:* `${{ github.sha }}`\n*Triggered by:* @${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run — check smoke test logs>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # ── Deploy log (approvers, timestamps, audit + test run links) ────────────
      - name: Append approval metadata to deploy log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          AUDIT_LINK: ${{ needs.validate-gates.outputs.audit_link }}
          SMOKE_RUN_URLS: ${{ needs.validate-gates.outputs.smoke_run_urls }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/actions/runs/${RUN_ID}/approvals" > /tmp/approvals.json 2>/dev/null || echo '[]' > /tmp/approvals.json

          APPROVERS=$(jq -r '
            [ .[] | select(.state == "approved") ]
            | map({ login: .user.login, approved_at: .created_at })
            | unique_by(.login)
          ' /tmp/approvals.json)

          jq -n \
            --argjson approvers "$APPROVERS" \
            --arg audit_link "$AUDIT_LINK" \
            --arg smoke_run_urls "$SMOKE_RUN_URLS" \
            --arg contract_id "${{ steps.deploy.outputs.contract_id }}" \
            --arg commit "${{ github.sha }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg logged_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{
              approvers: $approvers,
              audit_report_link: $audit_link,
              testnet_smoke_run_urls: ($smoke_run_urls | split(",")),
              contract_id: $contract_id,
              commit: $commit,
              ref: $ref,
              logged_at: $logged_at
            }' > deploy-log.json
          cat deploy-log.json

          echo "## 📋 Mainnet Deploy Log" >> "$GITHUB_STEP_SUMMARY"
          echo "### Approvers" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$APPROVERS" | jq -r '.[] | "- @\(.login) — approved at \(.approved_at)"' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Audit Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- $AUDIT_LINK" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Qualifying Testnet Smoke Test Runs" >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$SMOKE_RUN_URLS" | tr ',' '\n' | while read -r url; do
            [[ -n "$url" ]] && echo "- $url" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-deploy-log-${{ github.run_id }}
          path: deploy-log.json
          retention-days: 90
