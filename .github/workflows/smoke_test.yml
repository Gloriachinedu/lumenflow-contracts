name: Smoke Test (Testnet)

on:
  workflow_dispatch:
    inputs:
      contract_id:
        description: Deployed contract ID to test
        required: true

jobs:
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Stellar CLI
        run: |
          curl -sSfL \
            https://github.com/stellar/stellar-cli/releases/download/v22.8.1/stellar-cli-v22.8.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar

      # Node.js is required by scripts/generate_smoke_keypair.sh to build
      # and sign the canonical payment payload (see docs/signature-format.md).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache smoke-signer npm modules
        uses: actions/cache@v4
        with:
          path: scripts/.smoke_node_modules
          key: ${{ runner.os }}-smoke-npm-stellar-sdk-13.8.0
          restore-keys: ${{ runner.os }}-smoke-npm-stellar-sdk-

      - name: Run smoke test
        env:
          CONTRACT_ID: ${{ github.event.inputs.contract_id }}
          ADMIN_KEY: ${{ secrets.TESTNET_ADMIN_KEY }}
          MERCHANT_KEY: ${{ secrets.TESTNET_MERCHANT_KEY }}
          PAYER_KEY: ${{ secrets.TESTNET_PAYER_KEY }}
          TOKEN_ADDRESS: ${{ secrets.TESTNET_TOKEN_ADDRESS }}
          ADMIN_ADDRESS: ${{ secrets.TESTNET_ADMIN_ADDRESS }}
          MERCHANT_ADDRESS: ${{ secrets.TESTNET_MERCHANT_ADDRESS }}
          PAYER_ADDRESS: ${{ secrets.TESTNET_PAYER_ADDRESS }}
          NETWORK: testnet
        run: ./scripts/smoke_test.sh
