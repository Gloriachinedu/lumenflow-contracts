###############################################################################
# validate-secrets.yml — Validate required secrets before deployment jobs start
#
# Resolves: #850
#
# Runs a dedicated "gate" job at the beginning of every deploy workflow.
# If any required secret is absent or empty, the job fails fast with a clear
# error message before any deployment infrastructure is touched.
###############################################################################
name: Validate Secrets

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment (testnet | mainnet)"
        required: true
        type: string
    secrets:
      DEPLOYER_KEY:
        required: true
      ADMIN_KEY:
        required: true
      ADMIN_ADDRESS:
        required: true
      MERCHANT_KEY:
        required: false
      MERCHANT_ADDRESS:
        required: false
      PAYER_KEY:
        required: false
      PAYER_ADDRESS:
        required: false
      TOKEN_ADDRESS:
        required: false

  # Allow manual invocation for debugging
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment to validate secrets for"
        required: true
        default: "testnet"
        type: choice
        options:
          - testnet
          - mainnet

permissions:
  contents: read

jobs:
  validate-secrets:
    name: Validate Required Secrets (${{ inputs.environment || github.event.inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ── Testnet secret gate ─────────────────────────────────────────────────
      - name: Validate testnet secrets
        if: ${{ (inputs.environment || github.event.inputs.environment) == 'testnet' }}
        env:
          TESTNET_DEPLOYER_KEY: ${{ secrets.TESTNET_DEPLOYER_KEY }}
          TESTNET_ADMIN_KEY: ${{ secrets.TESTNET_ADMIN_KEY }}
          TESTNET_ADMIN_ADDRESS: ${{ secrets.TESTNET_ADMIN_ADDRESS }}
          TESTNET_MERCHANT_KEY: ${{ secrets.TESTNET_MERCHANT_KEY }}
          TESTNET_MERCHANT_ADDRESS: ${{ secrets.TESTNET_MERCHANT_ADDRESS }}
          TESTNET_PAYER_KEY: ${{ secrets.TESTNET_PAYER_KEY }}
          TESTNET_PAYER_ADDRESS: ${{ secrets.TESTNET_PAYER_ADDRESS }}
          TESTNET_TOKEN_ADDRESS: ${{ secrets.TESTNET_TOKEN_ADDRESS }}
        run: |
          set -euo pipefail
          MISSING=0

          check_secret() {
            local name="$1"
            local value="$2"
            local required="${3:-true}"
            if [[ -z "$value" ]]; then
              if [[ "$required" == "true" ]]; then
                echo "::error::Required secret '$name' is not set or is empty."
                MISSING=$((MISSING + 1))
              else
                echo "::warning::Optional secret '$name' is not set (non-blocking)."
              fi
            else
              echo "✅ $name is present (${#value} chars)"
            fi
          }

          echo "--- Checking testnet secrets ---"
          check_secret "TESTNET_DEPLOYER_KEY"     "$TESTNET_DEPLOYER_KEY"     "true"
          check_secret "TESTNET_ADMIN_KEY"         "$TESTNET_ADMIN_KEY"         "true"
          check_secret "TESTNET_ADMIN_ADDRESS"     "$TESTNET_ADMIN_ADDRESS"     "true"
          check_secret "TESTNET_MERCHANT_KEY"      "$TESTNET_MERCHANT_KEY"      "false"
          check_secret "TESTNET_MERCHANT_ADDRESS"  "$TESTNET_MERCHANT_ADDRESS"  "false"
          check_secret "TESTNET_PAYER_KEY"         "$TESTNET_PAYER_KEY"         "false"
          check_secret "TESTNET_PAYER_ADDRESS"     "$TESTNET_PAYER_ADDRESS"     "false"
          check_secret "TESTNET_TOKEN_ADDRESS"     "$TESTNET_TOKEN_ADDRESS"     "false"

          if [[ "$MISSING" -gt 0 ]]; then
            echo ""
            echo "::error::$MISSING required secret(s) missing for testnet deployment."
            echo "::error::Add missing secrets at: Settings > Secrets and variables > Actions"
            exit 1
          fi

          echo ""
          echo "✅ All required testnet secrets are present. Deployment may proceed."

      # ── Mainnet secret gate ─────────────────────────────────────────────────
      - name: Validate mainnet secrets
        if: ${{ (inputs.environment || github.event.inputs.environment) == 'mainnet' }}
        env:
          MAINNET_DEPLOYER_KEY: ${{ secrets.MAINNET_DEPLOYER_KEY }}
          MAINNET_ADMIN_KEY: ${{ secrets.MAINNET_ADMIN_KEY }}
          MAINNET_ADMIN_ADDRESS: ${{ secrets.MAINNET_ADMIN_ADDRESS }}
          MAINNET_SOURCE_ACCOUNT: ${{ secrets.MAINNET_SOURCE_ACCOUNT }}
        run: |
          set -euo pipefail
          MISSING=0

          check_secret() {
            local name="$1"
            local value="$2"
            local required="${3:-true}"
            if [[ -z "$value" ]]; then
              if [[ "$required" == "true" ]]; then
                echo "::error::Required secret '$name' is not set or is empty."
                MISSING=$((MISSING + 1))
              else
                echo "::warning::Optional secret '$name' is not set (non-blocking)."
              fi
            else
              echo "✅ $name is present (${#value} chars)"
            fi
          }

          echo "--- Checking mainnet secrets ---"
          check_secret "MAINNET_DEPLOYER_KEY"   "$MAINNET_DEPLOYER_KEY"   "true"
          check_secret "MAINNET_ADMIN_KEY"       "$MAINNET_ADMIN_KEY"       "true"
          check_secret "MAINNET_ADMIN_ADDRESS"   "$MAINNET_ADMIN_ADDRESS"   "true"
          check_secret "MAINNET_SOURCE_ACCOUNT"  "$MAINNET_SOURCE_ACCOUNT"  "true"

          if [[ "$MISSING" -gt 0 ]]; then
            echo ""
            echo "::error::$MISSING required secret(s) missing for mainnet deployment."
            echo "::error::Add missing secrets at: Settings > Secrets and variables > Actions"
            exit 1
          fi

          echo ""
          echo "✅ All required mainnet secrets are present. Deployment may proceed."

      # ── Stellar key format validation ───────────────────────────────────────
      - name: Validate Stellar key formats
        if: ${{ (inputs.environment || github.event.inputs.environment) == 'testnet' }}
        env:
          TESTNET_DEPLOYER_KEY: ${{ secrets.TESTNET_DEPLOYER_KEY }}
          TESTNET_ADMIN_KEY: ${{ secrets.TESTNET_ADMIN_KEY }}
        run: |
          set -euo pipefail
          INVALID=0

          # Stellar secret keys: 56-char base32 string starting with 'S'
          validate_stellar_secret() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              return  # already caught by the gate above
            fi
            if [[ ! "$value" =~ ^S[A-Z2-7]{55}$ ]]; then
              echo "::error::Secret '$name' does not match expected Stellar secret key format (S + 55 base32 chars)."
              INVALID=$((INVALID + 1))
            else
              echo "✅ $name has valid Stellar secret key format"
            fi
          }

          validate_stellar_secret "TESTNET_DEPLOYER_KEY" "$TESTNET_DEPLOYER_KEY"
          validate_stellar_secret "TESTNET_ADMIN_KEY"     "$TESTNET_ADMIN_KEY"

          if [[ "$INVALID" -gt 0 ]]; then
            echo "::error::$INVALID secret(s) have invalid format. Correct them before deploying."
            exit 1
          fi

      - name: Summary
        run: |
          echo "## ✅ Secret validation passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Environment: \`${{ inputs.environment || github.event.inputs.environment }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "All required secrets are present and correctly formatted." >> "$GITHUB_STEP_SUMMARY"
