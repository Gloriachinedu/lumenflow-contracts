name: Testnet Smoke Test

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target Stellar network"
        required: false
        default: "testnet"

# Prevent concurrent smoke tests against the same network
concurrency:
  group: smoke-${{ github.event.inputs.network || 'testnet' }}
  cancel-in-progress: false

jobs:
  deploy-and-smoke:
    name: Deploy & Smoke Test
    runs-on: ubuntu-latest
    environment: testnet

    steps:
      - uses: actions/checkout@v4

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.87.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-smoke-

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release --package lumenflow

      # ── Stellar CLI ─────────────────────────────────────────────────────────
      - name: Install Stellar CLI
        run: |
          cargo install stellar-cli --locked --version 22.8.1

      # ── Node.js (required by generate_smoke_keypair.sh) ─────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Cache the @stellar/stellar-sdk npm package used by the keygen helper.
      # The cache key includes the pinned SDK version so it is invalidated on
      # any version bump.
      - name: Cache smoke-signer npm modules
        uses: actions/cache@v4
        with:
          path: scripts/.smoke_node_modules
          key: ${{ runner.os }}-smoke-npm-stellar-sdk-13.8.0
          restore-keys: ${{ runner.os }}-smoke-npm-stellar-sdk-

      # ── Deploy ───────────────────────────────────────────────────────────────
      - name: Deploy contract to testnet
        id: deploy
        env:
          SOURCE_ACCOUNT: ${{ secrets.TESTNET_ADMIN_KEY }}
          NETWORK: ${{ github.event.inputs.network || 'testnet' }}
        run: |
          CONTRACT_ID=$(NETWORK="$NETWORK" SOURCE_ACCOUNT="$SOURCE_ACCOUNT" ./scripts/deploy.sh \
            | grep "Contract ID" | awk '{print $NF}')
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"

      # ── Generate throwaway keypair + signature ───────────────────────────────
      # The helper queries the on-chain merchant nonce, builds the canonical
      # payload (docs/signature-format.md), generates a fresh ed25519 keypair,
      # signs the payload, and exports SMOKE_SIG / SMOKE_PUBKEY / SMOKE_NONCE.
      - name: Generate smoke signature
        id: keygen
        env:
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
          NETWORK: ${{ github.event.inputs.network || 'testnet' }}
          MERCHANT_ADDRESS: ${{ secrets.TESTNET_MERCHANT_ADDRESS }}
          SMOKE_ORDER_ID: SMOKE_${{ github.run_id }}
        run: |
          chmod +x scripts/generate_smoke_keypair.sh
          # Export into this step's environment AND pass to subsequent steps
          eval "$(./scripts/generate_smoke_keypair.sh \
            --contract-id  "$CONTRACT_ID" \
            --merchant     "$MERCHANT_ADDRESS" \
            --order-id     "SMOKE_${{ github.run_id }}" \
            --amount       1 \
            --network      "$NETWORK")"
          # Propagate to later steps via GITHUB_ENV
          echo "SMOKE_SIG=$SMOKE_SIG"       >> "$GITHUB_ENV"
          echo "SMOKE_PUBKEY=$SMOKE_PUBKEY" >> "$GITHUB_ENV"
          echo "SMOKE_NONCE=$SMOKE_NONCE"   >> "$GITHUB_ENV"
          echo "SMOKE_ORDER_ID=SMOKE_${{ github.run_id }}" >> "$GITHUB_ENV"

      # ── Run smoke test ────────────────────────────────────────────────────────
      - name: Run smoke test
        env:
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
          NETWORK: ${{ github.event.inputs.network || 'testnet' }}
          ADMIN_KEY: ${{ secrets.TESTNET_ADMIN_KEY }}
          MERCHANT_KEY: ${{ secrets.TESTNET_MERCHANT_KEY }}
          PAYER_KEY: ${{ secrets.TESTNET_PAYER_KEY }}
          TOKEN_ADDRESS: ${{ secrets.TESTNET_TOKEN_ADDRESS }}
          ADMIN_ADDRESS: ${{ secrets.TESTNET_ADMIN_ADDRESS }}
          MERCHANT_ADDRESS: ${{ secrets.TESTNET_MERCHANT_ADDRESS }}
          PAYER_ADDRESS: ${{ secrets.TESTNET_PAYER_ADDRESS }}
          # SMOKE_SIG, SMOKE_PUBKEY, SMOKE_NONCE, SMOKE_ORDER_ID are set via GITHUB_ENV above
        run: ./scripts/smoke_test.sh
