###############################################################################
# Nightly CLI builds – closes #583
#
# Runs every day at 02:00 UTC.
# Builds the lumenflow-cli for three targets, uploads binaries as GitHub
# Release nightly artifacts, and notifies #ci-alerts on failure.
###############################################################################
name: Nightly CLI Builds

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write           # needed to create/update the nightly release

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: lumenflow-cli
  NIGHTLY_TAG: nightly

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest   # cross-compile on Linux via mingw
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation toolchain (Windows target)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update -y && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build CLI
        run: |
          cargo build \
            --release \
            --package lumenflow-cli \
            --target ${{ matrix.target }}

      - name: Package archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          BINARY="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          ARCHIVE="${{ env.BINARY_NAME }}-nightly-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package archive (zip – Windows)
        if: matrix.archive_ext == 'zip'
        run: |
          BINARY="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe"
          ARCHIVE="${{ env.BINARY_NAME }}-nightly-${{ matrix.target }}.zip"
          zip -j "$ARCHIVE" "$BINARY"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact for release job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-nightly-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          retention-days: 7

  publish:
    name: Publish nightly release
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Delete existing nightly release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ env.NIGHTLY_TAG }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Create nightly release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          gh release create "${{ env.NIGHTLY_TAG }}" \
            --title "Nightly CLI Build – ${TIMESTAMP}" \
            --notes "Automated nightly build from \`main\` at ${TIMESTAMP}.

**Targets included:**
- \`x86_64-unknown-linux-gnu\`
- \`x86_64-apple-darwin\`
- \`x86_64-pc-windows-gnu\`

These artifacts are retained for **7 days**. For stable releases, see the [Releases page](../../releases)." \
            --prerelease \
            dist/*

  notify-failure:
    name: Notify Slack on failure
    needs: [build, publish]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Send Slack alert
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": ":x: *Nightly CLI build failed*",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                    { "title": "Branch",     "value": "${{ github.ref_name }}",   "short": true },
                    { "title": "Run",        "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_CI_ALERTS_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
