name: CLI Nightly Build

on:
  schedule:
    # Run at 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cli-nightly:
    name: Nightly CLI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            use_cross: false

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56745cba8c7296529d2fc39830  # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-nightly-

      - name: Install cross (for aarch64 cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build CLI (native)
        if: "!matrix.use_cross"
        run: |
          cargo build \
            --target ${{ matrix.target }} \
            --release \
            --package lumenflow-cli
        working-directory: cli/lumenflow-cli

      - name: Build CLI (cross)
        if: matrix.use_cross
        run: |
          cross build \
            --target ${{ matrix.target }} \
            --release \
            --package lumenflow-cli
        working-directory: cli/lumenflow-cli

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          DATE=$(date -u +%Y%m%d)
          BINARY=target/${{ matrix.target }}/release/lumenflow-cli
          ARCHIVE=lumenflow-cli-nightly-${DATE}-${{ matrix.target }}.tar.gz
          tar -czf "$ARCHIVE" -C "$(dirname $BINARY)" "$(basename $BINARY)"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload nightly build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lumenflow-cli-nightly-${{ matrix.target }}
          path: |
            lumenflow-cli-nightly-*-${{ matrix.target }}.tar.gz
            lumenflow-cli-nightly-*-${{ matrix.target }}.tar.gz.sha256
          retention-days: 7
