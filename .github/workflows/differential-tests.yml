name: Differential Tests

# Resolves Issue #631: Add differential testing between SDK and direct stellar-sdk calls.
#
# Compares every SDK method against an equivalent raw @stellar/stellar-sdk invocation
# to catch subtle wrapping bugs (incorrect XDR encoding, wrong field names, etc.).
#
# Schedule: weekly on Monday at 08:00 UTC + on every PR to main/develop.

on:
  schedule:
    - cron: "0 8 * * 1"   # Weekly — every Monday at 08:00 UTC
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    name: SDK differential tests (@differential)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci --ignore-scripts

      - name: Run @differential test suite
        working-directory: sdk
        run: npx jest --testPathPattern="differential" --verbose
        env:
          SOROBAN_RPC_URL: ${{ secrets.TESTNET_RPC_URL || '' }}
          CONTRACT_ID: ${{ secrets.TESTNET_CONTRACT_ID || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-test-results
          path: sdk/coverage/
          retention-days: 30
