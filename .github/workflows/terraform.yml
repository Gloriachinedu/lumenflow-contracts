###############################################################################
# Terraform plan validation – runs on every PR that touches infra/terraform/
###############################################################################
name: Terraform Validate & Plan

on:
  pull_request:
    paths:
      - "infra/terraform/**"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    env:
      TF_VERSION: "1.8.5"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            terraform init -backend=false
          else
            terraform init \
              -backend-config="bucket=lumenflow-terraform-state" \
              -backend-config="key=lumenflow/terraform.tfstate" \
              -backend-config="region=us-east-1" \
              -backend-config="dynamodb_table=lumenflow-terraform-locks"
          fi

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'push'
        run: |
          terraform plan \
            -var="ci_runner_subnet_id=${{ secrets.TF_CI_RUNNER_SUBNET_ID }}" \
            -var="vpc_id=${{ secrets.TF_VPC_ID }}" \
            -var="alert_email=${{ secrets.TF_ALERT_EMAIL }}" \
            -var="slack_webhook_url=${{ secrets.TF_SLACK_WEBHOOK_URL }}" \
            -no-color \
            -out=tfplan 2>&1 | tee plan.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = 'infra/terraform/plan.txt';
            const plan = fs.existsSync(planPath)
              ? fs.readFileSync(planPath, 'utf8')
              : 'AWS-backed plans are skipped on pull requests. Format and validation checks ran without AWS credentials.';
            const body = `## Terraform Plan\n\`\`\`\n${plan.slice(0, 60000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
