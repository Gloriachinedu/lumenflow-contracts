name: Validate Credential Separation

# Runs on every PR and push to main/develop.
# Ensures that testnet and mainnet secrets are never used in the wrong environment
# and that no mainnet credentials are accidentally referenced outside the mainnet deploy path.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: credential-separation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-credential-separation:
    name: Validate Testnet / Mainnet Credential Separation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ── Check 1: No MAINNET secrets referenced outside mainnet deploy path ────
      - name: Check mainnet secrets not used in testnet workflows
        run: |
          set -euo pipefail

          MAINNET_SECRETS=(
            "MAINNET_DEPLOYER_KEY"
            "MAINNET_ADMIN_KEY"
            "MAINNET_SOURCE_ACCOUNT"
            "MAINNET_ADMIN_ADDRESS"
          )

          TESTNET_WORKFLOWS=(
            ".github/workflows/deploy-testnet.yml"
            ".github/workflows/testnet-smoke.yml"
            ".github/workflows/smoke_test.yml"
            ".github/workflows/ci.yml"
          )

          FAILURES=0
          for wf in "${TESTNET_WORKFLOWS[@]}"; do
            if [[ ! -f "$wf" ]]; then
              continue
            fi
            for secret in "${MAINNET_SECRETS[@]}"; do
              if grep -q "$secret" "$wf"; then
                echo "::error file=$wf::Mainnet secret '$secret' found in testnet workflow '$wf'"
                FAILURES=$((FAILURES + 1))
              fi
            done
          done

          if [[ "$FAILURES" -gt 0 ]]; then
            echo "::error::$FAILURES mainnet credential(s) found in testnet workflow(s). See errors above."
            exit 1
          fi

          echo "✅ No mainnet credentials found in testnet workflows."

      # ── Check 2: No TESTNET secrets referenced in mainnet deploy path ─────────
      - name: Check testnet secrets not used in mainnet deploy
        run: |
          set -euo pipefail

          TESTNET_SECRETS=(
            "TESTNET_DEPLOYER_KEY"
            "TESTNET_ADMIN_KEY"
            "TESTNET_MERCHANT_KEY"
            "TESTNET_PAYER_KEY"
          )

          MAINNET_WORKFLOWS=(
            ".github/workflows/deploy-mainnet.yml"
          )

          FAILURES=0
          for wf in "${MAINNET_WORKFLOWS[@]}"; do
            if [[ ! -f "$wf" ]]; then
              # File doesn't exist yet — skip, not a failure
              continue
            fi
            for secret in "${TESTNET_SECRETS[@]}"; do
              if grep -q "$secret" "$wf"; then
                echo "::error file=$wf::Testnet secret '$secret' found in mainnet workflow '$wf'"
                FAILURES=$((FAILURES + 1))
              fi
            done
          done

          if [[ "$FAILURES" -gt 0 ]]; then
            echo "::error::$FAILURES testnet credential(s) found in mainnet workflow(s)."
            exit 1
          fi

          echo "✅ No testnet credentials found in mainnet workflows."

      # ── Check 3: env files use correct NETWORK value ──────────────────────────
      - name: Validate env file NETWORK values
        run: |
          set -euo pipefail

          check_network() {
            local file="$1"
            local expected_network="$2"

            if [[ ! -f "$file" ]]; then
              echo "::warning::$file not found — skipping"
              return
            fi

            actual=$(grep -E '^NETWORK=' "$file" | cut -d= -f2 | tr -d '[:space:]"')
            if [[ "$actual" != "$expected_network" ]]; then
              echo "::error file=$file::Expected NETWORK=$expected_network but found NETWORK=$actual"
              exit 1
            fi
            echo "✅ $file: NETWORK=$actual (expected $expected_network)"
          }

          check_network "scripts/env/testnet.env" "testnet"
          check_network "scripts/env/mainnet.env" "mainnet"
          check_network "scripts/env/local.env"   "local"

      # ── Check 4: No raw Stellar secret key patterns in tracked files ─────────
      - name: Scan for accidentally committed credentials
        run: |
          set -euo pipefail

          # Stellar secret keys are 56-char base32 strings starting with 'S'
          # Pattern: S followed by 55 uppercase alphanumeric chars (simplified)
          if git grep -E '\bS[A-Z2-7]{55}\b' -- \
              ':!*.example' ':!*.md' ':!Cargo.lock' ':!docs/**' 2>/dev/null | grep -v '^Binary'; then
            echo "::error::Possible Stellar secret key found in tracked files!"
            echo "::error::Rotate the key immediately and remove it from git history."
            exit 1
          fi

          echo "✅ No raw Stellar secret keys detected in tracked files."
