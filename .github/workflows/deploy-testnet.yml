name: Deploy to Testnet

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release --package lumenflow

      - name: Check WASM size
        run: |
          WASM_SIZE=$(wc -c < target/wasm32-unknown-unknown/release/lumenflow.wasm)
          if [ $WASM_SIZE -gt 102400 ]; then
            echo "WASM too large: ${WASM_SIZE} bytes (limit: 102400 bytes)"
            exit 1
          fi
          echo "WASM size: ${WASM_SIZE} bytes"

      - name: Deploy contract
        id: deploy
        env:
          NETWORK: testnet
          SOURCE_ACCOUNT: ${{ secrets.TESTNET_DEPLOYER_KEY }}
        run: |
          set -euo pipefail
          OUTPUT=$(bash scripts/deploy.sh)
          CONTRACT_ID=$(echo "$OUTPUT" | grep -oP '(?<=Contract ID : ).*')
          echo "$CONTRACT_ID" > testnet-contract-id.txt
          echo "contract_id=${CONTRACT_ID}" >> "$GITHUB_OUTPUT"
          echo "Deployed contract: $CONTRACT_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit testnet-contract-id.txt
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add testnet-contract-id.txt
          git diff --staged --quiet || git commit -m 'chore: update testnet contract ID [skip ci]'
          git push

      - name: Notify Discord
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CONTRACT_ID: ${{ steps.deploy.outputs.contract_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ **LumenFlow testnet deployment succeeded**\n**Contract ID:** \`${CONTRACT_ID}\`\n**Commit:** \`${COMMIT_SHA}\`\"}"
