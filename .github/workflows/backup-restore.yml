###############################################################################
# backup-restore.yml — Managed backup and restore testing for production state
#
# Resolves: #854
#
# This workflow:
#   1. Creates a versioned backup of critical production state artifacts
#      (Terraform state metadata, deployment records, config files).
#   2. Runs a full restore drill to verify that the backup is actually
#      usable — not just present.
#   3. Uploads the backup bundle as a signed, retained artifact.
#   4. Alerts on failure so that a broken backup is never silently ignored.
#
# The restore drill logic is implemented in scripts/restore-drill.mjs, which
# does a full snapshot → serialize → restore → byte-for-byte compare cycle.
###############################################################################
name: Backup & Restore Testing

on:
  # Nightly backup + drill
  schedule:
    - cron: "0 3 * * *"

  # On every push to main (deploy artifacts change)
  push:
    branches: [main]
    paths:
      - "scripts/restore-drill.mjs"
      - "infra/terraform/**"
      - "Cargo.toml"
      - "Cargo.lock"

  # Manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (drill only, no artifact upload)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  backup-and-restore-drill:
    name: Backup & Restore Drill
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── Create backup bundle ───────────────────────────────────────────────
      - name: Create backup bundle
        id: backup
        run: |
          set -euo pipefail

          TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP_DIR="backup-bundle"
          mkdir -p "$BACKUP_DIR"

          # --- Critical config files ---
          # These files define the deployed contract's build environment,
          # workspace layout, and CI configuration.
          cp Cargo.toml              "$BACKUP_DIR/Cargo.toml"
          cp Cargo.lock              "$BACKUP_DIR/Cargo.lock"
          cp rust-toolchain.toml     "$BACKUP_DIR/rust-toolchain.toml"
          cp codecov.yml             "$BACKUP_DIR/codecov.yml"
          cp Makefile                "$BACKUP_DIR/Makefile"

          # --- Terraform config (non-secret) ---
          cp infra/terraform/main.tf        "$BACKUP_DIR/terraform-main.tf"
          cp infra/terraform/variables.tf   "$BACKUP_DIR/terraform-variables.tf"
          cp infra/terraform/outputs.tf     "$BACKUP_DIR/terraform-outputs.tf"

          # --- Deployment metadata (if present from a previous deploy) ---
          if [[ -f smoke-results/deployment-metadata.json ]]; then
            cp smoke-results/deployment-metadata.json "$BACKUP_DIR/deployment-metadata.json"
          else
            # Write a minimal record so the bundle is never empty
            cat > "$BACKUP_DIR/deployment-metadata.json" <<EOF
          {
            "note": "No deployment metadata from this run",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "backed_up_at": "$TIMESTAMP"
          }
          EOF
          fi

          # --- Manifest ---
          echo "backup_timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "backup_dir=$BACKUP_DIR"      >> "$GITHUB_OUTPUT"

          ls -lh "$BACKUP_DIR"
          echo "✅ Backup bundle created ($BACKUP_DIR)"

      # ── Run restore drill ──────────────────────────────────────────────────
      - name: Run restore drill
        id: drill
        run: |
          set -euo pipefail

          BACKUP_DIR="${{ steps.backup.outputs.backup_dir }}"

          # Build the file list from the backup bundle directory
          FILE_ARGS=$(find "$BACKUP_DIR" -type f | sort | sed "s|$BACKUP_DIR/||" | tr '\n' ' ')
          echo "Files to drill: $FILE_ARGS"

          # Run the restore drill against the backup directory by temporarily
          # switching CWD so relative paths resolve correctly
          (
            cd "$BACKUP_DIR"
            # Inline runner: creates a temporary entry point that sources the
            # drill module and passes all files in the bundle
            node - <<'EOF'
          import { runRestoreDrill } from '../scripts/restore-drill.mjs';
          import { readFileSync, readdirSync, statSync } from 'node:fs';
          import { resolve } from 'node:path';

          const dir = process.cwd();
          const files = {};

          function walk(base) {
            for (const entry of readdirSync(base)) {
              const abs = resolve(base, entry);
              const rel = abs.slice(dir.length + 1);
              if (statSync(abs).isFile()) {
                files[rel] = readFileSync(abs, 'utf8');
              }
            }
          }

          walk(dir);

          const fileCount = Object.keys(files).length;
          if (fileCount === 0) {
            process.stderr.write('ERROR: backup bundle is empty\n');
            process.exit(1);
          }

          const report = runRestoreDrill(files);
          process.stdout.write(
            `restore drill OK — ${report.fileCount} file(s), ${report.bytes} bytes, checksum ${report.checksum.slice(0,12)}…\n`
          );
          EOF
          )

          echo "drill_passed=true" >> "$GITHUB_OUTPUT"
          echo "✅ Restore drill passed"

      # ── Verify individual file checksums ──────────────────────────────────
      - name: Verify file checksums
        run: |
          set -euo pipefail

          BACKUP_DIR="${{ steps.backup.outputs.backup_dir }}"
          FAILURES=0

          echo "--- File integrity check ---"
          while IFS= read -r -d '' file; do
            rel="${file#$BACKUP_DIR/}"
            # Compare backup copy with the original in the workspace
            if [[ -f "$rel" ]]; then
              orig_sum=$(sha256sum "$rel"          | cut -d' ' -f1)
              back_sum=$(sha256sum "$file"         | cut -d' ' -f1)
              if [[ "$orig_sum" == "$back_sum" ]]; then
                echo "  ✅  $rel"
              else
                echo "  ❌  $rel — checksum mismatch (backup may be stale)"
                FAILURES=$((FAILURES + 1))
              fi
            else
              echo "  ℹ️   $rel — no workspace counterpart (generated file)"
            fi
          done < <(find "$BACKUP_DIR" -type f -print0 | sort -z)

          if [[ "$FAILURES" -gt 0 ]]; then
            echo "::error::$FAILURES file(s) failed the integrity check."
            exit 1
          fi
          echo "✅ All file checksums verified."

      # ── Upload backup artifact ─────────────────────────────────────────────
      - name: Upload backup artifact
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-backup-${{ steps.backup.outputs.backup_timestamp }}-${{ github.run_id }}
          path: ${{ steps.backup.outputs.backup_dir }}/
          retention-days: 90
          if-no-files-found: error

      # ── Step summary ───────────────────────────────────────────────────────
      - name: Write step summary
        if: always()
        run: |
          DRILL="${{ steps.drill.outputs.drill_passed || 'false' }}"
          TS="${{ steps.backup.outputs.backup_timestamp }}"

          if [[ "$DRILL" == "true" ]]; then
            echo "## ✅ Backup & Restore Drill Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Backup & Restore Drill Failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backup timestamp | \`$TS\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | \`${{ github.event.inputs.dry_run || 'false' }}\` |" >> "$GITHUB_STEP_SUMMARY"

      # ── Alert on failure ───────────────────────────────────────────────────
      - name: Alert on failure
        if: failure() && github.event_name == 'schedule' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ *Backup/restore drill FAILED*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Backup and restore drill failed*\n*Commit:* `${{ github.sha }}`\n*Ref:* `${{ github.ref_name }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
