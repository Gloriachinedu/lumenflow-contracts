###############################################################################
# backup-restore.yml — Managed backup and restore testing for production state
#
# Resolves: #854
#
# This workflow:
#   1. Creates a versioned backup of critical production state artifacts
#      (Terraform state metadata, deployment records, config files).
#   2. Runs a full restore drill to verify that the backup is actually
#      usable — not just present.
#   3. Uploads the backup bundle as a signed, retained artifact.
#   4. Alerts on failure so that a broken backup is never silently ignored.
#
# The restore drill logic is implemented in scripts/restore-drill.mjs, which
# does a full snapshot → serialize → restore → byte-for-byte compare cycle.
###############################################################################
name: Backup & Restore Testing

on:
  # Nightly backup + drill
  schedule:
    - cron: "0 3 * * *"
    # Monthly restore drill — first Monday of each month at 03:00 UTC
    - cron: "0 3 1-7 * 1"

  # On every push to main (deploy artifacts change)
  push:
    branches: [main]
    paths:
      - "scripts/restore-drill.mjs"
      - "infra/terraform/**"
      - "Cargo.toml"
      - "Cargo.lock"

  # Manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (drill only, no artifact upload)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  backup-and-restore-drill:
    name: Backup & Restore Drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      drill_passed: ${{ steps.drill.outputs.drill_passed || 'false' }}
      backup_timestamp: ${{ steps.backup.outputs.backup_timestamp }}
      checksum: ${{ steps.drill.outputs.checksum || '' }}
      rto_seconds: ${{ steps.rto.outputs.rto_seconds || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # ── Create backup bundle ───────────────────────────────────────────────
      - name: Create backup bundle
        id: backup
        run: |
          set -euo pipefail

          TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP_DIR="backup-bundle"
          mkdir -p "$BACKUP_DIR"

          # --- Critical config files ---
          # These files define the deployed contract's build environment,
          # workspace layout, and CI configuration.
          cp Cargo.toml              "$BACKUP_DIR/Cargo.toml"
          cp Cargo.lock              "$BACKUP_DIR/Cargo.lock"
          cp rust-toolchain.toml     "$BACKUP_DIR/rust-toolchain.toml"
          cp codecov.yml             "$BACKUP_DIR/codecov.yml"
          cp Makefile                "$BACKUP_DIR/Makefile"

          # --- Terraform config (non-secret) ---
          cp infra/terraform/main.tf        "$BACKUP_DIR/terraform-main.tf"
          cp infra/terraform/variables.tf   "$BACKUP_DIR/terraform-variables.tf"
          cp infra/terraform/outputs.tf     "$BACKUP_DIR/terraform-outputs.tf"

          # --- Deployment metadata (if present from a previous deploy) ---
          if [[ -f smoke-results/deployment-metadata.json ]]; then
            cp smoke-results/deployment-metadata.json "$BACKUP_DIR/deployment-metadata.json"
          else
            # Write a minimal record so the bundle is never empty
            cat > "$BACKUP_DIR/deployment-metadata.json" <<EOF
          {
            "note": "No deployment metadata from this run",
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "backed_up_at": "$TIMESTAMP"
          }
          EOF
          fi

          # --- Manifest ---
          echo "backup_timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "backup_dir=$BACKUP_DIR"      >> "$GITHUB_OUTPUT"

          ls -lh "$BACKUP_DIR"
          echo "✅ Backup bundle created ($BACKUP_DIR)"

      # ── Run restore drill ──────────────────────────────────────────────────
      - name: Run restore drill
        id: drill
        run: |
          set -euo pipefail

          BACKUP_DIR="${{ steps.backup.outputs.backup_dir }}"

          # Build the file list from the backup bundle directory
          FILE_ARGS=$(find "$BACKUP_DIR" -type f | sort | sed "s|$BACKUP_DIR/||" | tr '\n' ' ')
          echo "Files to drill: $FILE_ARGS"

          # Run the restore drill against the backup directory by temporarily
          # switching CWD so relative paths resolve correctly
          (
            cd "$BACKUP_DIR"
            # Inline runner: creates a temporary entry point that sources the
            # drill module and passes all files in the bundle
            node - <<'EOF'
          import { runRestoreDrill } from '../scripts/restore-drill.mjs';
          import { readFileSync, readdirSync, statSync } from 'node:fs';
          import { resolve } from 'node:path';

          const dir = process.cwd();
          const files = {};

          function walk(base) {
            for (const entry of readdirSync(base)) {
              const abs = resolve(base, entry);
              const rel = abs.slice(dir.length + 1);
              if (statSync(abs).isFile()) {
                files[rel] = readFileSync(abs, 'utf8');
              }
            }
          }

          walk(dir);

          const fileCount = Object.keys(files).length;
          if (fileCount === 0) {
            process.stderr.write('ERROR: backup bundle is empty\n');
            process.exit(1);
          }

          const report = runRestoreDrill(files);
          process.stdout.write(
            `restore drill OK — ${report.fileCount} file(s), ${report.bytes} bytes, checksum ${report.checksum.slice(0,12)}…\n`
          );
          process.stdout.write(`CHECKSUM=${report.checksum}\n`);
          EOF
          )

          echo "drill_passed=true" >> "$GITHUB_OUTPUT"
          echo "✅ Restore drill passed"

      # ── Verify individual file checksums ──────────────────────────────────
      - name: Verify file checksums
        run: |
          set -euo pipefail

          BACKUP_DIR="${{ steps.backup.outputs.backup_dir }}"
          FAILURES=0

          echo "--- File integrity check ---"
          while IFS= read -r -d '' file; do
            rel="${file#$BACKUP_DIR/}"
            # Compare backup copy with the original in the workspace
            if [[ -f "$rel" ]]; then
              orig_sum=$(sha256sum "$rel"          | cut -d' ' -f1)
              back_sum=$(sha256sum "$file"         | cut -d' ' -f1)
              if [[ "$orig_sum" == "$back_sum" ]]; then
                echo "  ✅  $rel"
              else
                echo "  ❌  $rel — checksum mismatch (backup may be stale)"
                FAILURES=$((FAILURES + 1))
              fi
            else
              echo "  ℹ️   $rel — no workspace counterpart (generated file)"
            fi
          done < <(find "$BACKUP_DIR" -type f -print0 | sort -z)

          if [[ "$FAILURES" -gt 0 ]]; then
            echo "::error::$FAILURES file(s) failed the integrity check."
            exit 1
          fi
          echo "✅ All file checksums verified."

      # ── Monthly drill: fresh environment + latest backup restore ───────────
      # Only runs on the monthly schedule (first Monday of each month).
      - name: Provision fresh environment
        id: fresh_env
        if: github.event_name == 'schedule' && github.event.schedule == '0 3 1-7 * 1'
        run: |
          set -euo pipefail
          # Record the drill start time so RTO can be measured end-to-end.
          START_EPOCH="$(date -u +%s)"
          echo "start_epoch=$START_EPOCH" >> "$GITHUB_OUTPUT"

          # Provision an isolated, empty restore target so we never restore
          # over the live workspace.
          FRESH_DIR="fresh-restore-env"
          rm -rf "$FRESH_DIR"
          mkdir -p "$FRESH_DIR"
          echo "fresh_dir=$FRESH_DIR" >> "$GITHUB_OUTPUT"
          echo "✅ Fresh restore environment provisioned ($FRESH_DIR)"

      - name: Restore latest backup into fresh environment
        id: restore
        if: github.event_name == 'schedule' && github.event.schedule == '0 3 1-7 * 1'
        run: |
          set -euo pipefail

          BACKUP_DIR="${{ steps.backup.outputs.backup_dir }}"
          FRESH_DIR="${{ steps.fresh_env.outputs.fresh_dir }}"

          # Restore the latest backup bundle into the fresh environment.
          cp -a "$BACKUP_DIR/." "$FRESH_DIR/"

          # Verify the restored copy via the restore drill module.
          (
            cd "$FRESH_DIR"
            node - <<'EOF'
          import { runRestoreDrill } from '../scripts/restore-drill.mjs';
          import { readFileSync, readdirSync, statSync } from 'node:fs';
          import { resolve } from 'node:path';

          const dir = process.cwd();
          const files = {};

          function walk(base) {
            for (const entry of readdirSync(base)) {
              const abs = resolve(base, entry);
              const rel = abs.slice(dir.length + 1);
              if (statSync(abs).isFile()) {
                files[rel] = readFileSync(abs, 'utf8');
              }
            }
          }

          walk(dir);

          if (Object.keys(files).length === 0) {
            process.stderr.write('ERROR: restored environment is empty\n');
            process.exit(1);
          }

          const report = runRestoreDrill(files);
          process.stdout.write(
            `restore OK — ${report.fileCount} file(s), checksum ${report.checksum.slice(0,12)}…\n`
          );
          process.stdout.write(`CHECKSUM=${report.checksum}\n`);
          EOF
          )

          echo "restore_ok=true" >> "$GITHUB_OUTPUT"
          echo "✅ Latest backup restored into fresh environment"

      - name: Run smoke tests against restored environment
        id: smoke
        if: github.event_name == 'schedule' && github.event.schedule == '0 3 1-7 * 1'
        run: |
          set -euo pipefail

          FRESH_DIR="${{ steps.fresh_env.outputs.fresh_dir }}"

          # Smoke test: restored critical files must exist and be non-empty.
          REQUIRED=(
            "Cargo.toml"
            "Cargo.lock"
            "rust-toolchain.toml"
            "terraform-main.tf"
            "deployment-metadata.json"
          )

          FAILURES=0
          for f in "${REQUIRED[@]}"; do
            if [[ -s "$FRESH_DIR/$f" ]]; then
              echo "  ✅  $f"
            else
              echo "  ❌  $f — missing or empty after restore"
              FAILURES=$((FAILURES + 1))
            fi
          done

          if [[ "$FAILURES" -gt 0 ]]; then
            echo "::error::$FAILURES smoke test(s) failed against restored environment."
            exit 1
          fi
          echo "✅ Smoke tests passed against restored environment"

      - name: Measure RTO
        id: rto
        if: github.event_name == 'schedule' && github.event.schedule == '0 3 1-7 * 1'
        run: |
          set -euo pipefail

          START_EPOCH="${{ steps.fresh_env.outputs.start_epoch }}"
          END_EPOCH="$(date -u +%s)"
          RTO_SECONDS=$((END_EPOCH - START_EPOCH))
          RTO_HOURS=$(awk "BEGIN { printf \"%.2f\", $RTO_SECONDS / 3600 }")
          RTO_LIMIT_SECONDS=$((4 * 3600))

          echo "rto_seconds=$RTO_SECONDS" >> "$GITHUB_OUTPUT"
          echo "rto_hours=$RTO_HOURS"     >> "$GITHUB_OUTPUT"
          echo "RTO: ${RTO_SECONDS}s (~${RTO_HOURS}h), limit ${RTO_LIMIT_SECONDS}s"

          if [[ "$RTO_SECONDS" -ge "$RTO_LIMIT_SECONDS" ]]; then
            echo "::error::RTO ${RTO_SECONDS}s exceeds the 4 hour limit."
            exit 1
          fi
          echo "✅ RTO within 4 hour limit"

      - name: Log drill result to artifact-retention.md
        if: github.event_name == 'schedule' && github.event.schedule == '0 3 1-7 * 1' && success()
        run: |
          set -euo pipefail

          DATE="$(date -u +%Y-%m-%d)"
          RTO_HOURS="${{ steps.rto.outputs.rto_hours }}"
          CHECKSUM="${{ steps.drill.outputs.checksum }}"
          RESULT="PASS"

          # Ensure the log file and its drill-results section exist.
          touch docs/artifact-retention.md
          if ! grep -q "## Restore Drill Results" docs/artifact-retention.md; then
            {
              echo ""
              echo "## Restore Drill Results"
              echo ""
              echo "| Date | RTO (h) | Result | Checksum |"
              echo "|------|---------|--------|----------|"
            } >> docs/artifact-retention.md
          fi

          echo "| $DATE | $RTO_HOURS | $RESULT | \`${CHECKSUM:0:16}\` |" >> docs/artifact-retention.md
          echo "✅ Drill result logged to docs/artifact-retention.md"

      # ── Upload backup artifact ─────────────────────────────────────────────
      - name: Upload backup artifact
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-backup-${{ steps.backup.outputs.backup_timestamp }}-${{ github.run_id }}
          path: ${{ steps.backup.outputs.backup_dir }}/
          retention-days: 90
          if-no-files-found: error

      # ── Step summary ───────────────────────────────────────────────────────
      - name: Write step summary
        if: always()
        run: |
          DRILL="${{ steps.drill.outputs.drill_passed || 'false' }}"
          TS="${{ steps.backup.outputs.backup_timestamp }}"

          if [[ "$DRILL" == "true" ]]; then
            echo "## ✅ Backup & Restore Drill Passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ Backup & Restore Drill Failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backup timestamp | \`$TS\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | \`${{ github.event.inputs.dry_run || 'false' }}\` |" >> "$GITHUB_STEP_SUMMARY"

      # ── Alert on failure ───────────────────────────────────────────────────
      - name: Alert on-call via Slack
        if: failure() && github.event_name == 'schedule' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ *Backup/restore drill FAILED*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Backup and restore drill failed*\n*On-call:* please investigate\n*Commit:* `${{ github.sha }}`\n*Ref:* `${{ github.ref_name }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Alert on-call via PagerDuty
        if: failure() && github.event_name == 'schedule' && env.PAGERDUTY_ROUTING_KEY != ''
        run: |
          set -euo pipefail
          curl -fsS -X POST "https://events.pagerduty.com/v2/enqueue" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "routing_key": "${PAGERDUTY_ROUTING_KEY}",
            "event_action": "trigger",
            "payload": {
              "summary": "Backup/restore drill FAILED (${GITHUB_REPOSITORY})",
              "source": "backup-restore.yml",
              "severity": "critical",
              "custom_details": {
                "commit": "${GITHUB_SHA}",
                "ref": "${GITHUB_REF_NAME}",
                "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              }
            }
          }
          EOF
        env:
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
