feat/npm-sdk-publishing
name: SDK Release

on:
  push:
    branches:
      - main
    paths:
      - 'sdk/**'
      - '.github/workflows/sdk-release.yml'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release SDK to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Release with semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
name: SDK Release (npm)

on:
  push:
    tags:
      - "sdk-v*.*.*"

permissions:
  contents: write
  id-token: write   # required for npm provenance

jobs:
  release:
    name: Build & Publish SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      # ── Version validation ─────────────────────────────────────────────────
      - name: Validate tag matches package.json version
        working-directory: sdk
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version validated: $PKG_VERSION"

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Build SDK
        working-directory: sdk
        run: npm run build

      - name: Verify dist artifacts exist
        working-directory: sdk
        run: |
          test -f dist/index.js   || { echo "ERROR: dist/index.js missing"; exit 1; }
          test -f dist/index.d.ts || { echo "ERROR: dist/index.d.ts missing"; exit 1; }

      # ── Publish ────────────────────────────────────────────────────────────
      - name: Publish to npm
        working-directory: sdk
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── GitHub Release ─────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
