name: SDK Release (npm)

# Triggered when a version tag matching sdk-v*.*.* is pushed.
# Example: git tag sdk-v0.3.0 && git push origin sdk-v0.3.0
on:
  push:
    tags:
      - "sdk-v[0-9]+.[0-9]+.[0-9]+"
      - "sdk-v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  id-token: write   # required for npm provenance attestation

jobs:
  release:
    name: Build & Publish SDK to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: sdk/package-lock.json

      # ── Version validation ──────────────────────────────────────────────────
      - name: Validate tag matches package.json version
        working-directory: sdk
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version : $TAG_VERSION"
          echo "pkg version : $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi
          echo "Version validated: $PKG_VERSION"

      # ── Install & Build ─────────────────────────────────────────────────────
      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Run tests
        working-directory: sdk
        run: npm test

      - name: Build SDK
        working-directory: sdk
        run: npm run build

      - name: Verify dist artifacts exist
        working-directory: sdk
        run: |
          test -f dist/cjs/index.js   || test -f dist/index.js   || { echo "ERROR: dist CJS entry missing"; exit 1; }
          test -f dist/cjs/index.d.ts || test -f dist/index.d.ts || { echo "ERROR: dist types missing";    exit 1; }
          echo "Dist artifacts verified."

      # ── Publish ─────────────────────────────────────────────────────────────
      - name: Publish @lumenflow/sdk to npm
        working-directory: sdk
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── GitHub Release ──────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
