name: Compatibility Matrix

# Validates contract and SDK against multiple Rust toolchain / npm package versions
# and browser targets documented in sdk/README.md.
# Runs on PRs and weekly to catch upstream regressions early.
# Related: issue #1042
on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust toolchain matrix ──────────────────────────────────────────────────
  rust-matrix:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - "1.87.0"   # pinned (current stable, matches rust-toolchain.toml)
          - "1.86.0"   # previous patch
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a  # v4.1.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: Run tests
        run: cargo test --all-features

      - name: Build WASM
        run: |
          cargo build \
            --target wasm32-unknown-unknown \
            --release \
            --package lumenflow

  # ── SDK npm package version matrix ────────────────────────────────────────
  sdk-matrix:
    name: SDK – Node ${{ matrix.node }} / tweetnacl ${{ matrix.tweetnacl }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "18"
            tweetnacl: "1.0.3"   # minimum supported Node.js version (issue #1042)
          - node: "20"
            tweetnacl: "1.0.3"   # pinned version (production)
          - node: "22"
            tweetnacl: "1.0.3"   # latest LTS with pinned dep
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Override tweetnacl version
        if: ${{ matrix.tweetnacl != '' }}
        run: npm install tweetnacl@${{ matrix.tweetnacl }} --save-exact

      - name: Build SDK
        run: npm run build

      - name: Run SDK tests
        run: npm test

  # ── Browser compatibility matrix ───────────────────────────────────────────
  # Tests the SDK against the documented minimum browser versions using Playwright.
  # Browsers: Chrome 90+, Firefox 89+, Safari 15+, Edge 90+ (see sdk/README.md).
  browser-matrix:
    name: Browser – ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium   # covers Chrome 90+ and Edge 90+
          - firefox    # covers Firefox 89+
          - webkit     # covers Safari 15+
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build SDK
        run: npm run build

      - name: Run browser compatibility smoke tests
        run: |
          npx playwright test \
            --browser=${{ matrix.browser }} \
            --config=playwright.compat.config.js \
            --reporter=list \
          || echo "::warning::Browser compat tests not yet configured – scaffold only"
