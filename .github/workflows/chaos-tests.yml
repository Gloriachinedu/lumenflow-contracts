name: RPC chaos tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  chaos:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-node@v4
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 22
      - name: Start Toxiproxy
        run: docker compose up -d toxiproxy
      - name: Create RPC proxy
        run: |
          curl --fail --retry 10 --retry-delay 2 -X POST http://localhost:8474/proxies \
            -H 'content-type: application/json' \
            -d '{"name":"lumenflow-rpc","listen":"0.0.0.0:18000","upstream":"host.docker.internal:8000"}'
      - name: Run opt-in chaos tests
        run: |
          CHAOS_TESTS=1 node --test tests/chaos/rpc-chaos.test.mjs 2>&1 | tee chaos-results.log
        env:
          TOXIPROXY_ADMIN_URL: http://localhost:8474
          TOXIPROXY_PROXY: lumenflow-rpc
          RPC_URL: http://localhost:18000
      - name: Upload chaos results
        if: always()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rpc-chaos-results
          path: chaos-results.log