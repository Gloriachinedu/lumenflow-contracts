name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e-refund-lifecycle:
    name: E2E – Refund Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tests/package.json

      - name: Install test dependencies
        run: npm install
        working-directory: tests

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests

      - name: Start Docker Compose test environment
        run: docker compose -f docker-compose.test.yml up -d --wait
        timeout-minutes: 5

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for mock-contract API..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then
              echo "mock-contract ready"
              break
            fi
            sleep 2
          done
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000; then
              echo "frontend ready"
              break
            fi
            sleep 2
          done

      - name: Run E2E refund lifecycle tests
        run: npx playwright test playwright/refund-lifecycle.spec.ts --reporter=list,html
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8080
          MOCK_WALLET: "1"
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: tests/playwright-report/
          retention-days: 14

      - name: Upload test videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos-e2e
          path: tests/test-results/
          retention-days: 7

      - name: Tear down Docker Compose
        if: always()
        run: docker compose -f docker-compose.test.yml down
