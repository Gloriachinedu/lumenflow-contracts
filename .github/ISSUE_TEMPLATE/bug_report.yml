name: Bug Report
description: Report a bug in LumenFlow contracts
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        > 💬 **Have a question or need help?** Please use [GitHub Discussions](https://github.com/PrincessnJoy/lumenflow-contracts/discussions/categories/developer-help) instead of opening an issue.
        >
        > This template is **only** for confirmed bugs in the contract code. For general questions, integration help, or ideas, visit the relevant Discussion category:
        > - 🙋 [Q&A](https://github.com/PrincessnJoy/lumenflow-contracts/discussions/categories/q-a) — Ask questions and get answers from the community
        > - 🛠️ [Developer Help](https://github.com/PrincessnJoy/lumenflow-contracts/discussions/categories/developer-help) — SDK, tooling, and integration questions
        > - 💡 [Feature Requests](https://github.com/PrincessnJoy/lumenflow-contracts/discussions/categories/feature-requests) — Suggest improvements

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behaviour.
      placeholder: |
        1. Deploy contract with ...
        2. Call `process_payment_with_signature` with ...
        3. Observe error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Rust version:
        - Stellar CLI version:
        - Network: (local / testnet / mainnet)
    validations:
      required: true
