name: Secret Rotation Checklist
description: Quarterly checklist for rotating GitHub Actions secrets
labels: ["security", "maintenance"]
assignees:
  - Gloriachinedu
body:
  - type: markdown
    attributes:
      value: |
        Use this template to track a quarterly secret rotation cycle.
        Follow the [credential separation guide](../../docs/credential-separation.md) for step-by-step instructions.

  - type: checkboxes
    id: testnet_secrets
    attributes:
      label: Testnet Secrets
      options:
        - label: "`TESTNET_DEPLOYER_KEY` rotated"
        - label: "`TESTNET_ADMIN_KEY` rotated"
        - label: "`TESTNET_MERCHANT_KEY` rotated"
        - label: "`TESTNET_PAYER_KEY` rotated"
        - label: "`TESTNET_TOKEN_ADDRESS` verified"
        - label: "`TESTNET_ADMIN_ADDRESS` updated"
        - label: "`TESTNET_MERCHANT_ADDRESS` updated"
        - label: "`TESTNET_PAYER_ADDRESS` updated"
        - label: "`TESTNET_SOURCE_ACCOUNT` rotated"

  - type: checkboxes
    id: mainnet_secrets
    attributes:
      label: Mainnet Secrets
      options:
        - label: "`MAINNET_DEPLOYER_KEY` rotated"
        - label: "`MAINNET_ADMIN_KEY` rotated"
        - label: "`MAINNET_SOURCE_ACCOUNT` rotated"
        - label: "`MAINNET_ADMIN_ADDRESS` updated"

  - type: textarea
    id: notes
    attributes:
      label: Rotation Notes
      description: Any issues encountered or deviations from the standard procedure.
