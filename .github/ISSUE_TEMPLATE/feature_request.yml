name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        > 💡 **Prefer to discuss first?** Post in [Feature Requests discussions](https://github.com/PrincessnJoy/lumenflow-contracts/discussions/categories/feature-requests) to gauge community interest before filing a formal issue.
        >
        > Use this template if you have a well-scoped, actionable feature proposal ready. For exploratory ideas or broad discussions visit [GitHub Discussions](https://github.com/PrincessnJoy/lumenflow-contracts/discussions).

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you've considered.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: This feature aligns with the LumenFlow scope (Soroban payment processing)
          required: true
