[package]
name = "lumenflow-router"
version = "0.1.0"
edition = "2021"
authors = ["LumenFlow Contributors"]
description = "Router contract stub for canary traffic splitting in LumenFlow"
license = "MIT"
repository = "https://github.com/Gloriachinedu/lumenflow-contracts"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "27.0.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "27.0.0", features = ["testutils", "alloc"] }

[features]
testutils = ["soroban-sdk/testutils"]
