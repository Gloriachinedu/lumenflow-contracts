[package]
name = "lumenflow-router"
version = "0.1.0"
edition = "2021"
authors = ["LumenFlow Contributors"]
description = "Router contract for LumenFlow payment routing decisions"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "26.0.1", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "26.0.1", features = ["testutils", "alloc"] }
lumenflow = { path = "../lumenflow", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
