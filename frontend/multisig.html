<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multisig Payment – LumenFlow</title>
  <meta name="description" content="Initiate and manage multi-signature payments on LumenFlow. Requires threshold approvals before funds are released." />
  <meta property="og:title" content="Multisig Payment – LumenFlow" />
  <meta property="og:description" content="Initiate and manage multi-signature payments on LumenFlow. Requires threshold approvals before funds are released." />
  <meta name="twitter:card" content="summary" />
  <style>
    /* Multisig-specific styles not in the shared design system */

    .signer-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      align-items: center;
    }
    .signer-row input { flex: 1; }

    .threshold-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    .threshold-row input[type=number] { width: 80px; }
    .threshold-row .of-label { font-size: 0.85rem; color: #555; }

    /* Progress panel */
    #progress-panel { display: none; }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    .progress-header h2 { border: none; padding: 0; margin: 0; }

    .progress-bar-wrap {
      background: #eee;
      border-radius: 999px;
      height: 10px;
      margin-bottom: 0.5rem;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: #6c47ff;
      border-radius: 999px;
      transition: width 0.4s;
    }
    .progress-label { font-size: 0.82rem; color: #555; margin-bottom: 1.25rem; }

    .signer-status-list { list-style: none; }
    .signer-status-list li {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.85rem;
    }
    .signer-status-list li:last-child { border-bottom: none; }
    .sig-icon { font-size: 1rem; }
    .sig-addr { flex: 1; word-break: break-all; color: #333; }
    .sig-status { font-size: 0.75rem; font-weight: 600; }
    .sig-status.signed  { color: #1a9e5c; }
    .sig-status.pending { color: #888; }

    .sign-btn {
      padding: 0.3rem 0.7rem;
      border: 1.5px solid #6c47ff;
      border-radius: 6px;
      background: #fff;
      color: #6c47ff;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .sign-btn:hover { background: #f0ecff; }
    .sign-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .execute-section { margin-top: 1.25rem; }
  </style>
</head>
<body>

<h1>Multisig Payment</h1>
<p class="subtitle">Initiate a payment that requires multiple signers to approve.</p>

<!-- Initiation form -->
<div class="card" id="form-panel">
  <h2>New Multisig Payment</h2>

  <div class="field">
    <label for="payment-id">Payment ID</label>
    <input type="text" id="payment-id" placeholder="MS_001"
           aria-describedby="err-payment-id" aria-invalid="false"
           aria-required="true" />
    <div class="err-msg" id="err-payment-id" role="alert" aria-live="polite"></div>
  </div>

  <div class="field">
    <label for="merchant-address">Merchant Address</label>
    <input type="text" id="merchant-address" placeholder="G…"
           aria-describedby="err-merchant" aria-invalid="false"
           aria-required="true" autocomplete="off" />
    <div class="err-msg" id="err-merchant" role="alert" aria-live="polite"></div>
  </div>

  <div class="field">
    <label for="token-address">Token Address</label>
    <input type="text" id="token-address" placeholder="C… or G…"
           aria-describedby="err-token" aria-invalid="false"
           aria-required="true" autocomplete="off" />
    <div class="err-msg" id="err-token" role="alert" aria-live="polite"></div>
  </div>

  <div class="field">
    <label for="amount">Amount (stroops)</label>
    <input type="number" id="amount" placeholder="5000000" min="1"
           aria-describedby="amount-hint err-amount" aria-invalid="false"
           aria-required="true" />
    <div class="hint" id="amount-hint">1 XLM = 10,000,000 stroops</div>
    <div class="err-msg" id="err-amount" role="alert" aria-live="polite"></div>
  </div>

  <!-- Signers -->
  <div class="field">
    <label id="signers-label">Signer Addresses</label>
    <div id="signers-list" aria-labelledby="signers-label">
      <div class="signer-row">
        <input type="text" placeholder="G… signer address" class="signer-input"
               aria-label="Signer address 1" aria-invalid="false"
               aria-required="true" autocomplete="off"
               oninput="updateThresholdLabel()" />
        <button class="btn-icon" onclick="removeSigner(this)" title="Remove">✕</button>
      </div>
    </div>
    <button class="btn-link" onclick="addSigner()">+ Add signer</button>
    <div class="err-msg" id="err-signers" role="alert" aria-live="polite"></div>
  </div>

  <!-- Required signatures threshold -->
  <div class="field">
    <label for="required-sigs">Required Signatures</label>
    <div class="threshold-row">
      <input type="number" id="required-sigs" min="1" value="1"
             aria-describedby="threshold-msg" aria-invalid="false"
             oninput="validateThreshold()" />
      <span class="of-label">of <strong id="signer-count">1</strong> signers</span>
    </div>
    <div class="validation-msg" id="threshold-msg" aria-live="polite"></div>
  </div>

  <div id="form-alert" class="alert" style="display:none" role="alert" aria-live="assertive"></div>

  <button class="btn btn-primary btn-full" id="submit-btn" onclick="submitForm()">Initiate Payment</button>
</div>

<!-- Progress panel (shown after initiation) -->
<div class="card" id="progress-panel">
  <div class="progress-header">
    <h2>Signature Progress</h2>
    <span id="progress-fraction" style="font-size:0.85rem;color:#555;"></span>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progress-label"></div>

  <ul class="signer-status-list" id="signer-status-list"></ul>

  <div class="execute-section">
    <div id="execute-alert" class="alert" style="display:none"></div>
    <button class="btn btn-primary btn-full" id="execute-btn" onclick="executePayment()" disabled>
      Execute Payment
    </button>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────

  let state = null; // { paymentId, merchantAddress, tokenAddress, amount, signers, required, signatures: Set }

  // ── Form validation helpers (issue #794) ──────────────────────────────────
  //
  // Standardized approach:
  //   • setFieldError(inputId, errId, message) — single function that keeps
  //     aria-invalid, .error CSS, and the error message div in sync.
  //   • Validation runs on blur (inline feedback) AND on submit (final check).
  //   • Error messages are only shown after the user has interacted with the
  //     field (touched), preventing premature red errors on page load.

  const STELLAR_KEY_BODY = /^[A-Z2-7]{55}$/;

  function isValidStellarKey(value, prefixes) {
    if (typeof value !== 'string' || value.length !== 56) return false;
    if (!prefixes.includes(value[0])) return false;
    return STELLAR_KEY_BODY.test(value.slice(1));
  }

  /**
   * Set or clear an inline field error.
   *
   * @param {string}  inputId  — id of the <input> element
   * @param {string}  errId    — id of the error <div>
   * @param {string}  message  — error text, or '' to clear
   */
  function setFieldError(inputId, errId, message) {
    const input = typeof inputId === 'string'
      ? document.getElementById(inputId)
      : inputId; // accept element directly for signer inputs
    const errEl = typeof errId === 'string'
      ? document.getElementById(errId)
      : errId;

    if (!input || !errEl) return;

    if (message) {
      errEl.textContent = message;
      errEl.style.display = 'block';
      errEl.classList.add('visible');
      input.classList.add('error');
      input.setAttribute('aria-invalid', 'true');
    } else {
      errEl.textContent = '';
      errEl.style.display = 'none';
      errEl.classList.remove('visible');
      input.classList.remove('error');
      input.setAttribute('aria-invalid', 'false');
    }
  }

  // ── Per-field validators (called on blur AND on submit) ───────────────────

  function validatePaymentId(reportError) {
    const val = document.getElementById('payment-id').value.trim();
    const msg = val ? '' : 'Payment ID is required.';
    if (reportError) setFieldError('payment-id', 'err-payment-id', msg);
    return !msg;
  }

  function validateMerchant(reportError) {
    const val = document.getElementById('merchant-address').value.trim();
    let msg = '';
    if (!val) msg = 'Merchant address is required.';
    else if (!isValidStellarKey(val, ['G'])) msg = 'Enter a valid Stellar address (starts with G, 56 characters).';
    if (reportError) setFieldError('merchant-address', 'err-merchant', msg);
    return !msg;
  }

  function validateToken(reportError) {
    const val = document.getElementById('token-address').value.trim();
    let msg = '';
    if (!val) msg = 'Token address is required.';
    else if (!isValidStellarKey(val, ['C', 'G'])) msg = 'Enter a valid token address (starts with C or G, 56 characters).';
    if (reportError) setFieldError('token-address', 'err-token', msg);
    return !msg;
  }

  function validateAmount(reportError) {
    const raw = document.getElementById('amount').value.trim();
    const num = Number(raw);
    let msg = '';
    if (!raw) msg = 'Amount is required.';
    else if (!Number.isInteger(num) || num < 1) msg = 'Amount must be a positive whole number of stroops.';
    if (reportError) setFieldError('amount', 'err-amount', msg);
    return !msg;
  }

  function validateSigners(reportError) {
    const signerInputs = Array.from(document.querySelectorAll('.signer-input'));
    const signers = signerInputs.map(i => i.value.trim()).filter(Boolean);
    let groupMsg = '';

    signerInputs.forEach(input => {
      const val = input.value.trim();
      const bad = val.length > 0 && !isValidStellarKey(val, ['G']);
      if (reportError) {
        input.classList.toggle('error', bad);
        input.setAttribute('aria-invalid', bad ? 'true' : 'false');
      }
      if (bad && !groupMsg) groupMsg = 'Each signer must be a valid Stellar address (starts with G, 56 characters).';
    });

    if (!groupMsg && signers.length === 0) groupMsg = 'At least one signer is required.';
    if (!groupMsg && new Set(signers).size !== signers.length) groupMsg = 'Signer addresses must be unique.';

    const errEl = document.getElementById('err-signers');
    if (reportError && errEl) {
      errEl.textContent  = groupMsg;
      errEl.style.display = groupMsg ? 'block' : 'none';
      errEl.classList.toggle('visible', !!groupMsg);
    }
    return !groupMsg;
  }

  function validateThreshold() {
    const required = parseInt(document.getElementById('required-sigs').value, 10);
    const count    = document.querySelectorAll('.signer-input').length;
    const msg      = document.getElementById('threshold-msg');
    const reqInput = document.getElementById('required-sigs');

    if (!required || required < 1) {
      msg.textContent = 'Required signatures must be at least 1.';
      msg.className   = 'validation-msg bad';
      reqInput.setAttribute('aria-invalid', 'true');
      return false;
    }
    if (required > count) {
      msg.textContent = `Required (${required}) cannot exceed signer count (${count}).`;
      msg.className   = 'validation-msg bad';
      reqInput.setAttribute('aria-invalid', 'true');
      return false;
    }
    msg.textContent = `✔ Valid: ${required} of ${count} signatures required.`;
    msg.className   = 'validation-msg ok';
    reqInput.setAttribute('aria-invalid', 'false');
    return true;
  }

  /**
   * Run all field validators and show errors for every failing field.
   * @returns {boolean} true if the form is fully valid
   */
  function validateForm() {
    const a = validatePaymentId(true);
    const b = validateMerchant(true);
    const c = validateToken(true);
    const d = validateAmount(true);
    const e = validateSigners(true);
    const f = validateThreshold();

    if (!a || !b || !c || !d || !e || !f) {
      // Move focus to the first invalid field for screen reader users
      const firstInvalid = document.querySelector('[aria-invalid="true"]');
      if (firstInvalid) firstInvalid.focus();
    }

    return a && b && c && d && e && f;
  }

  // ── Signer number tracking for aria-labels ────────────────────────────────

  function refreshSignerLabels() {
    document.querySelectorAll('.signer-input').forEach((input, idx) => {
      input.setAttribute('aria-label', `Signer address ${idx + 1}`);
    });
  }

  // ── Signer management ──────────────────────────────────────────────────────

  function addSigner() {
    const row = document.createElement('div');
    row.className = 'signer-row';
    row.innerHTML = `
      <input type="text" placeholder="G… signer address" class="signer-input"
             aria-invalid="false" aria-required="true" autocomplete="off"
             oninput="updateThresholdLabel()" />
      <button class="btn-icon" onclick="removeSigner(this)" aria-label="Remove signer" title="Remove">✕</button>`;
    document.getElementById('signers-list').appendChild(row);
    // Wire blur validation on the new input
    const newInput = row.querySelector('.signer-input');
    newInput.addEventListener('blur', () => validateSigners(true));
    refreshSignerLabels();
    updateThresholdLabel();
  }

  function removeSigner(btn) {
    const rows = document.querySelectorAll('.signer-row');
    if (rows.length <= 1) return; // keep at least one
    btn.closest('.signer-row').remove();
    refreshSignerLabels();
    updateThresholdLabel();
  }

  function getSignerValues() {
    return Array.from(document.querySelectorAll('.signer-input'))
      .map(i => i.value.trim())
      .filter(Boolean);
  }

  function updateThresholdLabel() {
    const count = document.querySelectorAll('.signer-input').length;
    document.getElementById('signer-count').textContent = count;
    validateThreshold();
  }

  // ── Blur-time validation (inline feedback as user fills form) ─────────────
  //
  // Errors appear after the user leaves a field (blur event), not while typing.
  // This matches the most accessible pattern: don't startle users with errors
  // before they've had a chance to complete the field.

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('payment-id')
      .addEventListener('blur', () => validatePaymentId(true));
    document.getElementById('merchant-address')
      .addEventListener('blur', () => validateMerchant(true));
    document.getElementById('token-address')
      .addEventListener('blur', () => validateToken(true));
    document.getElementById('amount')
      .addEventListener('blur', () => validateAmount(true));
    // Signer inputs – delegated because they are dynamically added
    document.getElementById('signers-list')
      .addEventListener('blur', e => {
        if (e.target.classList.contains('signer-input')) validateSigners(true);
      }, true);
  });

  // ── Contract interaction ───────────────────────────────────────────────────

  const CONTRACT_ID = window.LUMENFLOW_CONTRACT_ID || '';
  const RPC_URL     = window.LUMENFLOW_RPC_URL     || 'https://soroban-testnet.stellar.org';

  async function callInitiateMultisig({ paymentId, merchantAddress, tokenAddress, amount, signers, required }) {
    if (!CONTRACT_ID) {
      // Demo mode: simulate success
      await new Promise(r => setTimeout(r, 600));
      return { success: true };
    }

    try {
      const { SorobanRpc, Contract, nativeToScVal, Networks, TransactionBuilder, BASE_FEE, Keypair } =
        await import('https://cdn.jsdelivr.net/npm/@stellar/stellar-sdk@12/+esm');

      const server = new SorobanRpc.Server(RPC_URL);
      // Wallet integration point: replace with Freighter/Albedo call
      throw new Error('Connect a wallet to sign transactions. Set window.LUMENFLOW_CONTRACT_ID and integrate Freighter.');
    } catch (e) {
      return { success: false, error: e.message };
    }
  }

  async function callSignMultisig(paymentId, signerAddress) {
    if (!CONTRACT_ID) {
      await new Promise(r => setTimeout(r, 400));
      return { success: true };
    }
    return { success: false, error: 'Wallet integration required.' };
  }

  async function callExecuteMultisig(paymentId) {
    if (!CONTRACT_ID) {
      await new Promise(r => setTimeout(r, 500));
      return { success: true };
    }
    return { success: false, error: 'Wallet integration required.' };
  }

  // ── Submit ─────────────────────────────────────────────────────────────────

  async function submitForm() {
    if (!validateForm()) return;

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Initiating…';

    const paymentId      = document.getElementById('payment-id').value.trim();
    const merchantAddress = document.getElementById('merchant-address').value.trim();
    const tokenAddress   = document.getElementById('token-address').value.trim();
    const amount         = parseInt(document.getElementById('amount').value, 10);
    const signers        = getSignerValues();
    const required       = parseInt(document.getElementById('required-sigs').value, 10);

    const result = await callInitiateMultisig({ paymentId, merchantAddress, tokenAddress, amount, signers, required });

    if (!result.success) {
      const alert = document.getElementById('form-alert');
      alert.textContent = result.error || 'Failed to initiate payment.';
      alert.className   = 'alert alert-error';
      alert.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Initiate Payment';
      return;
    }

    // Store state and show progress panel
    state = { paymentId, merchantAddress, tokenAddress, amount, signers, required, signatures: new Set() };
    document.getElementById('form-panel').style.display = 'none';
    renderProgress();
    document.getElementById('progress-panel').style.display = 'block';
  }

  // ── Progress ───────────────────────────────────────────────────────────────

  function renderProgress() {
    const { signers, required, signatures } = state;
    const signed = signatures.size;
    const pct    = Math.round((signed / signers.length) * 100);

    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-fraction').textContent = `${signed} / ${signers.length} signed`;
    document.getElementById('progress-label').textContent =
      signed >= required
        ? `✔ Threshold met (${required} required). Ready to execute.`
        : `${required - signed} more signature(s) needed to reach threshold.`;

    const list = document.getElementById('signer-status-list');
    list.innerHTML = '';
    signers.forEach(addr => {
      const isSigned = signatures.has(addr);
      const li = document.createElement('li');
      li.innerHTML = `
        <span class="sig-icon">${isSigned ? '✅' : '⬜'}</span>
        <span class="sig-addr">${addr}</span>
        <span class="sig-status ${isSigned ? 'signed' : 'pending'}">${isSigned ? 'Signed' : 'Pending'}</span>
        <button class="sign-btn" onclick="signPayment('${addr}')" ${isSigned ? 'disabled' : ''}>
          ${isSigned ? 'Signed' : 'Sign'}
        </button>`;
      list.appendChild(li);
    });

    const execBtn = document.getElementById('execute-btn');
    execBtn.disabled = signed < required;
  }

  async function signPayment(signerAddress) {
    const btn = [...document.querySelectorAll('.sign-btn')]
      .find(b => b.closest('li').querySelector('.sig-addr').textContent === signerAddress);
    if (btn) { btn.disabled = true; btn.textContent = 'Signing…'; }

    const result = await callSignMultisig(state.paymentId, signerAddress);

    if (result.success) {
      state.signatures.add(signerAddress);
      renderProgress();
    } else {
      if (btn) { btn.disabled = false; btn.textContent = 'Sign'; }
      showExecuteAlert(result.error || 'Signing failed.', false);
    }
  }

  async function executePayment() {
    const btn = document.getElementById('execute-btn');
    btn.disabled = true;
    btn.textContent = 'Executing…';

    const result = await callExecuteMultisig(state.paymentId);

    if (result.success) {
      showExecuteAlert('✔ Payment executed successfully!', true);
      btn.textContent = 'Executed';
    } else {
      btn.disabled = false;
      btn.textContent = 'Execute Payment';
      showExecuteAlert(result.error || 'Execution failed.', false);
    }
  }

  function showExecuteAlert(msg, success) {
    const el = document.getElementById('execute-alert');
    el.textContent   = msg;
    el.className     = 'alert ' + (success ? 'alert-success' : 'alert-error');
    el.style.display = 'block';
  }

  // ── Init ───────────────────────────────────────────────────────────────────

  document.getElementById('required-sigs').addEventListener('input', validateThreshold);
  updateThresholdLabel();
</script>
</body>
</html>
