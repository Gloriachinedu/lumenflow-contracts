<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment History (Paginated) – LumenFlow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 2rem 1rem;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 { font-size: 1.4rem; font-weight: 700; color: #6c47ff; margin-bottom: 0.25rem; }
    .subtitle { color: #666; font-size: 0.875rem; margin-bottom: 1.5rem; }

    /* ── Table ─────────────────────────────────────────────────────────── */
    .table-wrap {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      overflow-x: auto;
      margin-bottom: 1rem;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }

    thead th {
      padding: 0.85rem 1rem;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      border-bottom: 1px solid #eee;
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid #f4f4f4; transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #faf8ff; }
    td { padding: 0.8rem 1rem; vertical-align: middle; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .badge-completed       { background: #e6f9f0; color: #1a9e5c; }
    .badge-partial         { background: #fff7e6; color: #b86a00; }
    .badge-fully-refunded  { background: #f0ecff; color: #6c47ff; }

    .order-id { font-family: monospace; font-size: 0.82rem; color: #444; }
    .amount   { font-weight: 700; }

    .empty-row td {
      text-align: center;
      padding: 3rem;
      color: #aaa;
      font-size: 0.9rem;
    }

    /* ── Pagination bar ────────────────────────────────────────────────── */
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 0.75rem 0;
    }

    .page-meta { font-size: 0.85rem; color: #555; }

    .page-controls { display: flex; gap: 0.5rem; align-items: center; }

    .btn {
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid #6c47ff;
      background: #fff;
      color: #6c47ff;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .btn:hover:not(:disabled) { background: #f0ecff; }
    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: #ccc;
      color: #999;
    }

    .page-size-wrap { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #555; }
    .page-size-wrap select {
      padding: 0.35rem 0.6rem;
      border: 1.5px solid #dde1e7;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    .page-size-wrap select:focus { border-color: #6c47ff; }

    /* Loading overlay */
    .loading-msg {
      text-align: center;
      padding: 2rem;
      color: #888;
      font-size: 0.875rem;
    }

    .load-more-sentinel {
      height: 1px;
    }

    .load-more-btn,
    .loading-indicator {
      display: none;
      margin: 0.75rem auto;
    }

    .loading-indicator {
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: #888;
      font-size: 0.875rem;
    }

    .spinner {
      width: 1rem;
      height: 1rem;
      border: 2px solid #dde1e7;
      border-top-color: #6c47ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .load-more-btn { display: flex; }
      .spinner { animation: none; }
    }
  </style>
</head>
<body>

<h1>Payment History</h1>
<p class="subtitle">Browse paginated payment records.</p>

<div class="table-wrap">
  <table id="history-table">
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Merchant</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr class="empty-row"><td colspan="5">Loading…</td></tr>
    </tbody>
  </table>
</div>

<!-- Pagination controls and infinite-scroll status -->
<div class="pagination-bar" id="pagination-bar">
  <div class="page-meta" id="page-meta"></div>

  <div class="page-controls">
    <button class="btn load-more-btn" id="load-more-btn" type="button" onclick="loadNextPage()">
      Load more
    </button>
  </div>

  <div class="page-size-wrap">
    <label for="page-size">Per page:</label>
    <select id="page-size" onchange="changePageSize()">
      <option value="5" selected>5</option>
      <option value="10">10</option>
      <option value="25">25</option>
    </select>
  </div>
</div>
<div id="loading-indicator" class="loading-indicator" role="status" aria-live="polite" hidden>
  <span class="spinner" aria-hidden="true"></span>
  Loading more payments…
</div>
<div id="load-more-sentinel" class="load-more-sentinel" aria-hidden="true"></div>

<script>
  // ── Pagination state ───────────────────────────────────────────────────────
  let nextCursor = new URLSearchParams(window.location.search).get('cursor');
  let pageSize = 5;
  let isLoading = false;
  let hasMore = true;
  const loadedOrderIds = new Set();

  // ── Mock data simulating contract paginated API ────────────────────────────
  const ALL_PAYMENTS = [
    { order_id: 'ORDER_001', merchant_address: 'GDUT...XZ1A', amount: 1000, status: 'Completed',         paid_at: '2026-06-01' },
    { order_id: 'ORDER_002', merchant_address: 'GCMR...Y9KP', amount: 4500, status: 'PartiallyRefunded', paid_at: '2026-06-03' },
    { order_id: 'ORDER_003', merchant_address: 'GDUT...XZ1A', amount: 750,  status: 'Completed',         paid_at: '2026-06-05' },
    { order_id: 'ORDER_004', merchant_address: 'GCMR...Y9KP', amount: 200,  status: 'FullyRefunded',     paid_at: '2026-06-07' },
    { order_id: 'ORDER_005', merchant_address: 'GDUT...XZ1A', amount: 3200, status: 'Completed',         paid_at: '2026-06-09' },
    { order_id: 'ORDER_006', merchant_address: 'GCMR...Y9KP', amount: 600,  status: 'Completed',         paid_at: '2026-06-11' },
    { order_id: 'ORDER_007', merchant_address: 'GDUT...XZ1A', amount: 980,  status: 'PartiallyRefunded', paid_at: '2026-06-13' },
    { order_id: 'ORDER_008', merchant_address: 'GCMR...Y9KP', amount: 120,  status: 'Completed',         paid_at: '2026-06-15' },
    { order_id: 'ORDER_009', merchant_address: 'GDUT...XZ1A', amount: 8750, status: 'Completed',         paid_at: '2026-06-17' },
    { order_id: 'ORDER_010', merchant_address: 'GCMR...Y9KP', amount: 310,  status: 'FullyRefunded',     paid_at: '2026-06-19' },
    { order_id: 'ORDER_011', merchant_address: 'GDUT...XZ1A', amount: 2200, status: 'Completed',         paid_at: '2026-06-21' },
    { order_id: 'ORDER_012', merchant_address: 'GCMR...Y9KP', amount: 540,  status: 'Completed',         paid_at: '2026-06-23' },
  ];

  /**
   * Simulates the contract's paginated query.
   * Replace with a real Soroban RPC call when CONTRACT_ID is available.
   *
   * Returns: { payments: [...], next_cursor: string|null }
   */
  async function fetchPage(cursor, limit) {
    await new Promise(r => setTimeout(r, 120)); // simulate latency

    const startIdx = cursor ? ALL_PAYMENTS.findIndex(p => p.order_id === cursor) : 0;
    const slice = ALL_PAYMENTS.slice(startIdx, startIdx + limit);
    const remaining = ALL_PAYMENTS.slice(startIdx + limit);
    const next_cursor = remaining.length > 0 ? remaining[0].order_id : null;

    return { payments: slice, next_cursor };
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function statusBadge(status) {
    const map = {
      Completed:         ['badge-completed',      'Completed'],
      PartiallyRefunded: ['badge-partial',         'Partial Refund'],
      FullyRefunded:     ['badge-fully-refunded',  'Fully Refunded'],
    };
    const [cls, label] = map[status] || ['', status];
    return `<span class="badge ${cls}">${label}</span>`;
  }

  function setLoading(on) {
    isLoading = on;
    const indicator = document.getElementById('loading-indicator');
    const button = document.getElementById('load-more-btn');
    indicator.hidden = !on;
    indicator.style.display = on ? 'flex' : 'none';
    button.disabled = on || !hasMore;
  }

  function updateCursorInUrl() {
    const url = new URL(window.location.href);
    if (nextCursor) url.searchParams.set('cursor', nextCursor);
    else url.searchParams.delete('cursor');
    window.history.replaceState({}, '', url);
  }

  function appendPayments(payments) {
    const tbody = document.getElementById('table-body');
    const newPayments = payments.filter(payment => {
      if (loadedOrderIds.has(payment.order_id)) return false;
      loadedOrderIds.add(payment.order_id);
      return true;
    });

    if (newPayments.length === 0 && loadedOrderIds.size === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No payments found.</td></tr>';
      return 0;
    }

    if (tbody.querySelector('.empty-row')) tbody.innerHTML = '';
    tbody.insertAdjacentHTML('beforeend', newPayments.map(p => `
      <tr>
        <td><span class="order-id">${p.order_id}</span></td>
        <td>${p.merchant_address}</td>
        <td class="amount">${p.amount.toLocaleString()} XLM</td>
        <td>${statusBadge(p.status)}</td>
        <td>${p.paid_at}</td>
      </tr>`).join(''));
    return newPayments.length;
  }

  async function loadNextPage() {
    if (isLoading || !hasMore) return;
    setLoading(true);

    const { payments, next_cursor } = await fetchPage(nextCursor, pageSize);
    const addedCount = appendPayments(payments);
    nextCursor = next_cursor;
    hasMore = Boolean(nextCursor) && addedCount > 0;
    updateCursorInUrl();

    // Update meta text
    document.getElementById('page-meta').textContent =
      loadedOrderIds.size === 0
        ? 'No records'
        : `Showing ${loadedOrderIds.size} record${loadedOrderIds.size !== 1 ? 's' : ''}`;

    setLoading(false);
  }

  function changePageSize() {
    pageSize = parseInt(document.getElementById('page-size').value, 10);
    nextCursor = null;
    hasMore = true;
    loadedOrderIds.clear();
    document.getElementById('table-body').innerHTML = '';
    loadNextPage();
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  const observer = new IntersectionObserver(entries => {
    if (entries.some(entry => entry.isIntersecting)) loadNextPage();
  }, { rootMargin: '240px' });
  observer.observe(document.getElementById('load-more-sentinel'));
  loadNextPage();
</script>
</body>
</html>
