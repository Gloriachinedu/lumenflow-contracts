    return fmtFn(n, { minimumFractionDigits: 2, maximumFractionDigits: 7 }) + ' XLM';

  /**
   * Simulates the contract's paginated query.
   * Replace with a real Soroban RPC call when CONTRACT_ID is available.
   * @param {string|null} cursor  - order_id to start from (null = first page)
   * @param {number}      limit
   * @returns {{ payments: object[], next_cursor: string|null }}
   */
  async function fetchPage(cursor, limit) {
    await new Promise(r => setTimeout(r, 150)); // simulate network latency
    const startIdx    = cursor ? ALL_PAYMENTS.findIndex(p => p.order_id === cursor) : 0;
    const slice       = ALL_PAYMENTS.slice(startIdx, startIdx + limit);
    const remaining   = ALL_PAYMENTS.slice(startIdx + limit);
    const next_cursor = remaining.length > 0 ? remaining[0].order_id : null;
    return { payments: slice, next_cursor };
  }

  // ── Status badge ───────────────────────────────────────────────────────────
  function statusBadge(status) {
    const map = {
      Completed:         ['badge-completed',     'Completed'],
      PartiallyRefunded: ['badge-partial',        'Partial Refund'],
      FullyRefunded:     ['badge-fully-refunded', 'Fully Refunded'],
    };
    const [cls, label] = map[status] || ['', status];
    return `<span class="badge ${cls}">${label}</span>`;
  }

  // ── URL sync ───────────────────────────────────────────────────────────────
  /**
   * Updates the browser URL query string with the current cursor and page size
   * so the page can be bookmarked or shared at the current position.
   */
  function syncUrl() {
    const params = new URLSearchParams();
    const cursor = cursorStack[currentIdx];
    if (cursor)       params.set('cursor',   cursor);
    if (pageSize !== 5) params.set('limit', String(pageSize));
    const qs = params.toString();
    window.history.replaceState({}, '', qs ? `?${qs}` : window.location.pathname);
  }

  /**
   * Reads `?cursor=` and `?limit=` from the URL on first load so a bookmarked
   * URL restores the correct page.  Because we don't have the full cursor
   * history we treat the URL cursor as a direct jump to that page (page number
   * is shown as "–" until the user navigates).
   */
  function initFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const cursor = params.get('cursor') || null;
    const limit  = parseInt(params.get('limit') || '5', 10);

    if ([5, 10, 25].includes(limit)) {
      pageSize = limit;
      document.getElementById('page-size').value = String(limit);
    }

    if (cursor) {
      // We can't reconstruct the full back-stack from a single cursor, so start
      // fresh from that cursor. The user can still go forward; Prev is disabled
      // because we don't have anything to go back to.
      cursorStack = [cursor];
      currentIdx  = 0;
    }
  }

  // ── Screen-reader announcements ────────────────────────────────────────────
  function announce(message) {
    const el = document.getElementById('page-announcer');
    if (!el) return;
    el.textContent = '';
    // Force a re-announcement even when the message is unchanged.
    window.setTimeout(() => { el.textContent = message; }, 50);
  }

  // ── Loading state ──────────────────────────────────────────────────────────
  function showLoadingState() {
    const tbody = document.getElementById('table-body');
    // Spinner row replaces table content during fetch
    tbody.innerHTML = `
      <tr class="empty-row">
        <td colspan="5" style="padding:2rem;text-align:center;color:#888;">
          <span aria-live="polite" role="status">⏳ Loading page ${currentIdx + 1}…</span>
        </td>
      </tr>`;
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    if (prevBtn) prevBtn.disabled = true;
    if (nextBtn) nextBtn.disabled = true;
    document.getElementById('page-meta').textContent = `Page ${currentIdx + 1} · loading…`;
  }

  // ── Main load ──────────────────────────────────────────────────────────────
  async function loadPage() {
    if (isLoading) return;
    isLoading = true;

    showLoadingState();

    const cursor = cursorStack[currentIdx];
    const { payments, next_cursor } = await fetchPage(cursor, pageSize);

    // Store next cursor if we haven't visited this position before
    if (next_cursor && cursorStack.length === currentIdx + 1) {
      cursorStack.push(next_cursor);
    }

    // Render rows
    const tbody = document.getElementById('table-body');
    const newPayments = payments.filter(payment => {
      if (loadedOrderIds.has(payment.order_id)) return false;
      loadedOrderIds.add(payment.order_id);
      return true;
    });

    if (newPayments.length === 0 && loadedOrderIds.size === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No payments found.</td></tr>';
    } else {
      tbody.innerHTML = payments.map(p => `
        <tr>
          <td><span class="order-id">${p.order_id}</span></td>
          <td>${p.merchant_address}</td>
          <td class="amount">${fmtAmount(p.amount)}</td>
          <td>${statusBadge(p.status)}</td>
          <td>${p.paid_at}</td>
        </tr>`).join('');
    }

    // Page indicator: "Page 2 · 5 records"
    const pageNum = currentIdx + 1;
    const metaText =
      loadedOrderIds.size === 0
        ? 'No records'
        : `Page ${pageNum} · ${payments.length} record${payments.length !== 1 ? 's' : ''}`;
    document.getElementById('page-meta').textContent = metaText;

    // Update navigation button states
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    if (prevBtn) prevBtn.disabled = currentIdx === 0;
    if (nextBtn) nextBtn.disabled = !next_cursor;

    // Announce the page change to screen readers
    announce(metaText);

    // Sync URL so the current page is bookmarkable
    syncUrl();

    isLoading = false;
  }

  // Track whether the initial load has completed (we don't move focus on first load)
  let _focusMgmtInitialized = false;

  // ── Navigation ─────────────────────────────────────────────────────────────
  function prevPage() {
    if (currentIdx > 0) {
      currentIdx--;
      loadPage();
    }
  }

  function nextPage() {
    if (currentIdx + 1 < cursorStack.length) {
      currentIdx++;
      loadPage();
    }
  }

  function changePageSize() {
    pageSize = parseInt(document.getElementById('page-size').value, 10);
    nextCursor = null;
    hasMore = true;
    loadedOrderIds.clear();
    document.getElementById('table-body').innerHTML = '';
    loadNextPage();
  }

  // ── Filters ────────────────────────────────────────────────────────────────
  let activeFilters = { status: '', merchant: '' };

  /**
   * Reads the current filter dropdown values and applies them to the table.
   * Called by the Apply button and by filter-keyboard.js on Enter/Space.
   */
  function applyFilters() {
    const statusEl   = document.getElementById('filter-status');
    const merchantEl = document.getElementById('filter-merchant');
    activeFilters = {
      status:   statusEl ? statusEl.value : '',
      merchant: merchantEl ? merchantEl.value : '',
    };
    renderFilteredRows();
  }

  /**
   * Clears all filters and restores the unfiltered table.
   */
  function clearFilters() {
    const statusEl   = document.getElementById('filter-status');
    const merchantEl = document.getElementById('filter-merchant');
    if (statusEl)   statusEl.value = '';
    if (merchantEl) merchantEl.value = '';
    activeFilters = { status: '', merchant: '' };
    renderFilteredRows();
  }

  /**
   * Renders rows from ALL_PAYMENTS honouring the active filters.
   */
  function renderFilteredRows() {
    const tbody = document.getElementById('table-body');
    if (!tbody) return;

    const filtered = ALL_PAYMENTS.filter(p => {
      if (activeFilters.status && p.status !== activeFilters.status) return false;
      if (activeFilters.merchant && p.merchant_address !== activeFilters.merchant) return false;
      return true;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No payments match the selected filters.</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(p => `
      <tr>
        <td><span class="order-id">${p.order_id}</span></td>
        <td>${p.merchant_address}</td>
        <td class="amount">${fmtAmount(p.amount)}</td>
        <td>${statusBadge(p.status)}</td>
        <td>${p.paid_at}</td>

  }

  // Expose filter helpers for filter-keyboard.js

  window.clearFilters = clearFilters;

  // ── Browser back/forward button support ───────────────────────────────────
  window.addEventListener('popstate', () => {
    initFromUrl();
    loadPage();
