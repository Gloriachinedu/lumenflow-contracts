<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment History – LumenFlow</title>
  <meta name="description" content="View and filter your complete LumenFlow payment history, sorted and paginated for easy browsing." />
  <meta property="og:title" content="Payment History – LumenFlow" />
  <meta property="og:description" content="View and filter your complete LumenFlow payment history, sorted and paginated for easy browsing." />
  <meta name="twitter:card" content="summary" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6c47ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LumenFlow" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #6c47ff;
    }

    /* ── Filter Panel ────────────────────────────────────────────────────────── */
    .filter-panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .filter-group label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
    }

    .filter-group input, .filter-group select {
      padding: 0.6rem;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .filter-group input:focus, .filter-group select:focus {
      border-color: #6c47ff;
    }

    .range-inputs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .range-inputs input { width: 100%; }

    .filter-group input.input-error { border-color: #c0392b; }
    .filter-err {
      display: none;
      font-size: 0.75rem;
      color: #c0392b;
    }

    /* ── Active Filters (Chips) ──────────────────────────────────────────────── */
    .active-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #f0f0f0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      background: #f0ecff;
      color: #6c47ff;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      gap: 0.4rem;
    }

    .chip button {
      background: none;
      border: none;
      color: #6c47ff;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0 0.2rem;
      display: flex;
      align-items: center;
    }

    .chip button:hover { color: #5032d1; }

    /* ── Results Table ────────────────────────────────────────────────────────── */
    .results-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #fafbfc;
      padding: 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      border-bottom: 1px solid #eee;
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid #f9f9f9;
      font-size: 0.9rem;
    }

    tr:last-child td { border-bottom: none; }

    /* ── Mobile Responsive ───────────────────────────────────────────────────── */
    @media (max-width: 767px) {
      body { padding: 1rem 0.5rem; }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .range-inputs {
        flex-wrap: wrap;
      }
      .range-inputs input { width: calc(50% - 1rem); }

      /* Hide table, show card layout instead */
      .results-card { overflow-x: hidden; }

      table thead { display: none; }

      table, tbody, tr, td {
        display: block;
        width: 100%;
      }

      tr {
        border: 1px solid #eee;
        border-radius: 8px;
        margin-bottom: 0.75rem;
        padding: 0.75rem;
        background: #fff;
      }
      tr:last-child { margin-bottom: 0; }

      td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.35rem 0;
        border-bottom: none;
        font-size: 0.85rem;
      }

      td::before {
        content: attr(data-label);
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        flex-shrink: 0;
        margin-right: 0.5rem;
      }
    }

    .amount-cell { font-weight: 600; color: #1a1a2e; }
    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    .status-completed          { background: #e6f9f0; color: #1a9e5c; }
    .status-partiallyrefunded  { background: #fff3e0; color: #e07b00; }
    .status-fullyrefunded      { background: #fce8e8; color: #c0392b; }
    .status-unknown            { background: #f0f0f0; color: #666; }

    .empty-state {
      padding: 4rem 2rem;
      text-align: center;
      color: #888;
    }

    /* ── Skeleton loading rows ────────────────────────────────────────────────── */
    .skeleton-body tr td {
      padding: 1rem;
      border-bottom: 1px solid #f9f9f9;
    }

    .skeleton-cell {
      display: inline-block;
      border-radius: 4px;
      background: linear-gradient(90deg, #e8e8e8 25%, #f5f5f5 50%, #e8e8e8 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      height: 14px;
      vertical-align: middle;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Vary widths so columns look realistic */
    .skeleton-cell.w-date   { width: 120px; }
    .skeleton-cell.w-id     { width: 90px; }
    .skeleton-cell.w-addr   { width: 110px; }
    .skeleton-cell.w-amount { width: 80px; }
    .skeleton-cell.w-status { width: 70px; }

    /* ── Accessibility ────────────────────────────────────────────────────────── */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* WCAG 2.1 AA focus ring: #6c47ff on white = 5.4:1 contrast ratio,
       exceeds the 3:1 minimum for non-text focus indicators (SC 1.4.11). */
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid #6c47ff;
      outline-offset: 2px;
      border-radius: 3px;
    }

    /* ── Verified Badge ───────────────────────────────────────────────────────── */
    .verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.7rem;
      color: #1a9e5c;
      font-weight: 600;
    }

    /* ── Skip link ───────────────────────────────────────────────────────── */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 0;
      background: #6c47ff;
      color: #fff;
      padding: 0.5rem 1rem;
      font-weight: 700;
      border-radius: 0 0 6px 0;
      z-index: 9999;
      text-decoration: none;
    }
    .skip-link:focus { top: 0; }
  </style>
</head>
<body>
<a href="#history-main" class="skip-link">Skip to main content</a>

<main id="history-main">
<div class="container">
  <header>
    <h1>Payment History</h1>
  </header>

  <section class="filter-panel" aria-labelledby="filter-heading">
    <h2 id="filter-heading" class="sr-only">Filters</h2>
    
    <div class="filter-grid">
      <!-- Merchant Address -->
      <div class="filter-group" style="grid-column: 1 / -1;">
        <label for="merchant-address">Merchant Address</label>
        <input type="text" id="merchant-address" placeholder="G… your Stellar address" autocomplete="off" aria-describedby="merchant-address-err">
        <div class="filter-err" id="merchant-address-err" role="alert" aria-live="polite"></div>
      </div>

      <!-- Date Range -->
      <div class="filter-group">
        <label for="date-start">Date Range</label>
        <div class="range-inputs">
          <input type="date" id="date-start" aria-label="Start Date">
          <span>to</span>
          <input type="date" id="date-end" aria-label="End Date">
        </div>
      </div>

      <!-- Amount Range -->
      <div class="filter-group">
        <label for="amount-min">Amount Range (XLM)</label>
        <div class="range-inputs">
          <input type="number" id="amount-min" placeholder="Min" min="0" step="0.1" aria-describedby="amount-min-err">
          <span>to</span>
          <input type="number" id="amount-max" placeholder="Max" min="0" step="0.1" aria-describedby="amount-max-err">
        </div>
        <div class="filter-err" id="amount-min-err" role="alert" aria-live="polite"></div>
        <div class="filter-err" id="amount-max-err" role="alert" aria-live="polite"></div>
      </div>

      <!-- Token -->
      <div class="filter-group">
        <label for="token-selector">Token</label>
        <select id="token-selector">
          <option value="">All Tokens</option>
          <option value="native">Native (XLM)</option>
          <option value="USDC">USDC</option>
        </select>
      </div>

      <!-- Status -->
      <div class="filter-group">
        <label for="status-selector">Status</label>
        <select id="status-selector">
          <option value="Any">Any Status</option>
          <option value="Completed">Completed</option>
          <option value="PartiallyRefunded">Partially Refunded</option>
          <option value="FullyRefunded">Fully Refunded</option>
        </select>
      </div>

      <!-- Currency display toggle -->
      <div class="filter-group">
        <label for="currency-display-toggle">Display Amounts As</label>
        <select id="currency-display-toggle" aria-label="Currency display format">
          <option value="native">Native Token</option>
          <option value="xlm">XLM Equivalent</option>
        </select>
      </div>
    </div>

    <div id="active-filters" class="active-filters" aria-live="polite">
      <!-- Chips will be rendered here -->
    </div>
  </section>

  <div class="results-card" id="results-region" aria-live="polite" aria-atomic="false" aria-label="Payment history results">
    <!-- Loading state -->
    <div id="loading-state" style="display:none;padding:3rem;text-align:center;color:#888;" role="status" aria-live="polite" aria-label="Loading payments">
      ⏳ Loading payments…
    </div>

    <!-- Error state -->
    <div id="error-state" style="display:none;padding:3rem;text-align:center;color:#c0392b;" role="alert" aria-live="assertive">
      <div style="font-size:1.5rem;margin-bottom:0.5rem">⚠</div>
      <strong id="error-msg">Failed to load payments.</strong>
      <div style="margin-top:0.75rem">
        <button onclick="retryFetch()" style="padding:0.4rem 1rem;border:1.5px solid #c0392b;border-radius:6px;background:#fff;color:#c0392b;font-weight:600;cursor:pointer">Retry</button>
      </div>
    </div>

    <table id="history-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Order ID</th>
          <th>Recipient</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="history-body">
        <!-- Rows will be rendered here -->
      </tbody>
    </table>
    <div id="empty-state" class="empty-state" style="display:none" role="status" aria-label="No payments found matching your filters" aria-live="polite">
      <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <circle cx="60" cy="60" r="54" fill="#f0ecff"/>
        <rect x="30" y="42" width="60" height="42" rx="7" fill="#e0d9ff"/>
        <rect x="38" y="52" width="28" height="5" rx="2.5" fill="#b8a9f5"/>
        <rect x="38" y="62" width="44" height="5" rx="2.5" fill="#c5bafc"/>
        <rect x="38" y="72" width="20" height="5" rx="2.5" fill="#d8d1fe"/>
        <circle cx="84" cy="36" r="14" fill="#fff" stroke="#b8a9f5" stroke-width="2.5"/>
        <line x1="80" y1="36" x2="88" y2="36" stroke="#b8a9f5" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="84" y1="32" x2="84" y2="40" stroke="#b8a9f5" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <p style="margin-top:1rem;font-weight:600;color:#1a1a2e;font-size:1rem">No payments yet</p>
      <p style="margin-top:0.4rem;color:#888;font-size:0.85rem">Payments will appear here once transactions are made.</p>
    </div>
  </div>
</div>

<script type="module" src="history.js"></script>

</main>
</body>
</html>
