<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment History – LumenFlow</title>
  <meta name="description" content="View and filter your complete LumenFlow payment history, sorted and paginated for easy browsing." />
  <meta property="og:title" content="Payment History – LumenFlow" />
  <meta property="og:description" content="View and filter your complete LumenFlow payment history, sorted and paginated for easy browsing." />
  <meta name="twitter:card" content="summary" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#6c47ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LumenFlow" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #6c47ff;
    }

    /* ── Filter Panel ────────────────────────────────────────────────────────── */
    .filter-panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .filter-group label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
    }

    .filter-group input, .filter-group select {
      padding: 0.6rem;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .filter-group input:focus, .filter-group select:focus {
      border-color: #6c47ff;
    }

    .range-inputs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .range-inputs input { width: 100%; }

    .filter-group input.input-error { border-color: #c0392b; }
    .filter-err {
      display: none;
      font-size: 0.75rem;
      color: #c0392b;
    }

    /* ── Active Filters (Chips) ──────────────────────────────────────────────── */
    .active-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #f0f0f0;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      background: #f0ecff;
      color: #6c47ff;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      gap: 0.4rem;
    }

    .chip button {
      background: none;
      border: none;
      color: #6c47ff;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0 0.2rem;
      display: flex;
      align-items: center;
    }

    .chip button:hover { color: #5032d1; }

    /* ── Results Table ────────────────────────────────────────────────────────── */
    .results-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #fafbfc;
      padding: 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      border-bottom: 1px solid #eee;
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid #f9f9f9;
      font-size: 0.9rem;
    }

    tr:last-child td { border-bottom: none; }

    /* ── Mobile Responsive ───────────────────────────────────────────────────── */
    @media (max-width: 767px) {
      body { padding: 1rem 0.5rem; }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .range-inputs {
        flex-wrap: wrap;
      }
      .range-inputs input { width: calc(50% - 1rem); }

      /* Hide table, show card layout instead */
      .results-card { overflow-x: hidden; }

      table thead { display: none; }

      table, tbody, tr, td {
        display: block;
        width: 100%;
      }

      tr {
        border: 1px solid #eee;
        border-radius: 8px;
        margin-bottom: 0.75rem;
        padding: 0.75rem;
        background: #fff;
      }
      tr:last-child { margin-bottom: 0; }

      td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.35rem 0;
        border-bottom: none;
        font-size: 0.85rem;
      }

      td::before {
        content: attr(data-label);
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        flex-shrink: 0;
        margin-right: 0.5rem;
      }
    }

    .amount-cell { font-weight: 600; color: #1a1a2e; }
    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    .status-completed          { background: #e6f9f0; color: #1a9e5c; }
    .status-partiallyrefunded  { background: #fff3e0; color: #e07b00; }
    .status-fullyrefunded      { background: #fce8e8; color: #c0392b; }
    .status-unknown            { background: #f0f0f0; color: #666; }

    .empty-state {
      padding: 4rem 2rem;
      text-align: center;
      color: #888;
    }

    /* ── Skeleton loading rows ────────────────────────────────────────────────── */
    .skeleton-body tr td {
      padding: 1rem;
      border-bottom: 1px solid #f9f9f9;
    }

    .skeleton-cell {
      display: inline-block;
      border-radius: 4px;
      background: linear-gradient(90deg, #e8e8e8 25%, #f5f5f5 50%, #e8e8e8 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      height: 14px;
      vertical-align: middle;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Vary widths so columns look realistic */
    .skeleton-cell.w-date   { width: 120px; }
    .skeleton-cell.w-id     { width: 90px; }
    .skeleton-cell.w-addr   { width: 110px; }
    .skeleton-cell.w-amount { width: 80px; }
    .skeleton-cell.w-status { width: 70px; }

    /* ── Accessibility ────────────────────────────────────────────────────────── */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* WCAG 2.1 AA focus ring: #6c47ff on white = 5.4:1 contrast ratio,
       exceeds the 3:1 minimum for non-text focus indicators (SC 1.4.11). */
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible {
      outline: 3px solid #6c47ff;
      outline-offset: 2px;
      border-radius: 3px;
    }

    /* ── Verified Badge ───────────────────────────────────────────────────────── */
    .verified-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.7rem;
      color: #1a9e5c;
      font-weight: 600;
    }

    /* ── Skip link ───────────────────────────────────────────────────────── */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 0;
      background: #6c47ff;
      color: #fff;
      padding: 0.5rem 1rem;
      font-weight: 700;
      border-radius: 0 0 6px 0;
      z-index: 9999;
      text-decoration: none;
    }
    .skip-link:focus { top: 0; }
  </style>
</head>
<body>
<a href="#history-main" class="skip-link">Skip to main content</a>

<main id="history-main">
<div class="container">
  <header>
    <h1>Payment History</h1>
  </header>

  <section class="filter-panel" aria-labelledby="filter-heading">
    <h2 id="filter-heading" class="sr-only">Filters</h2>
    
    <div class="filter-grid">
      <!-- Merchant Address -->
      <div class="filter-group" style="grid-column: 1 / -1;">
        <label for="merchant-address">Merchant Address</label>
        <input type="text" id="merchant-address" placeholder="G… your Stellar address" autocomplete="off" aria-describedby="merchant-address-err">
        <div class="filter-err" id="merchant-address-err" role="alert" aria-live="polite"></div>
      </div>

      <!-- Date Range -->
      <div class="filter-group">
        <label for="date-start">Date Range</label>
        <div class="range-inputs">
          <input type="date" id="date-start" aria-label="Start Date">
          <span>to</span>
          <input type="date" id="date-end" aria-label="End Date">
        </div>
      </div>

      <!-- Amount Range -->
      <div class="filter-group">
        <label for="amount-min">Amount Range (XLM)</label>
        <div class="range-inputs">
          <input type="number" id="amount-min" placeholder="Min" min="0" step="0.1" aria-describedby="amount-min-err">
          <span>to</span>
          <input type="number" id="amount-max" placeholder="Max" min="0" step="0.1" aria-describedby="amount-max-err">
        </div>
        <div class="filter-err" id="amount-min-err" role="alert" aria-live="polite"></div>
        <div class="filter-err" id="amount-max-err" role="alert" aria-live="polite"></div>
      </div>

      <!-- Token -->
      <div class="filter-group">
        <label for="token-selector">Token</label>
        <select id="token-selector">
          <option value="">All Tokens</option>
          <option value="native">Native (XLM)</option>
          <option value="USDC">USDC</option>
        </select>
      </div>

      <!-- Status -->
      <div class="filter-group">
        <label for="status-selector">Status</label>
        <select id="status-selector">
          <option value="Any">Any Status</option>
          <option value="Completed">Completed</option>
          <option value="PartiallyRefunded">Partially Refunded</option>
          <option value="FullyRefunded">Fully Refunded</option>
        </select>
      </div>

      <!-- Currency display toggle -->
      <div class="filter-group">
        <label for="currency-display-toggle">Display Amounts As</label>
        <select id="currency-display-toggle" aria-label="Currency display format">
          <option value="native">Native Token</option>
          <option value="xlm">XLM Equivalent</option>
        </select>
      </div>
    </div>

    <div id="active-filters" class="active-filters" aria-live="polite">
      <!-- Chips will be rendered here -->
    </div>
  </section>

  <div class="results-card" id="results-region" aria-live="polite" aria-atomic="false" aria-label="Payment history results">
    <!-- Loading state -->
    <div id="loading-state" style="display:none;padding:3rem;text-align:center;color:#888;" role="status" aria-live="polite" aria-label="Loading payments">
      ⏳ Loading payments…
    </div>

    <!-- Error state -->
    <div id="error-state" style="display:none;padding:3rem;text-align:center;color:#c0392b;" role="alert" aria-live="assertive">
      <div style="font-size:1.5rem;margin-bottom:0.5rem">⚠</div>
      <strong id="error-msg">Failed to load payments.</strong>
      <div style="margin-top:0.75rem">
        <button onclick="retryFetch()" style="padding:0.4rem 1rem;border:1.5px solid #c0392b;border-radius:6px;background:#fff;color:#c0392b;font-weight:600;cursor:pointer">Retry</button>
      </div>
    </div>

    <table id="history-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Order ID</th>
          <th>Recipient</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="history-body">
        <!-- Rows will be rendered here -->
      </tbody>
    </table>
    <div id="empty-state" class="empty-state" style="display:none" role="status" aria-label="No payments found matching your filters" aria-live="polite">
      <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <circle cx="60" cy="60" r="54" fill="#f0ecff"/>
        <rect x="30" y="42" width="60" height="42" rx="7" fill="#e0d9ff"/>
        <rect x="38" y="52" width="28" height="5" rx="2.5" fill="#b8a9f5"/>
        <rect x="38" y="62" width="44" height="5" rx="2.5" fill="#c5bafc"/>
        <rect x="38" y="72" width="20" height="5" rx="2.5" fill="#d8d1fe"/>
        <circle cx="84" cy="36" r="14" fill="#fff" stroke="#b8a9f5" stroke-width="2.5"/>
        <line x1="80" y1="36" x2="88" y2="36" stroke="#b8a9f5" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="84" y1="32" x2="84" y2="40" stroke="#b8a9f5" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <p style="margin-top:1rem;font-weight:600;color:#1a1a2e;font-size:1rem">No payments yet</p>
      <p style="margin-top:0.4rem;color:#888;font-size:0.85rem">Payments will appear here once transactions are made.</p>
    </div>
  </div>
</div>

<script type="module">
  import { validateAddress, validateAmount } from './validation.js';
  import {
    DEMO_MODE, CONTRACT_ID, NETWORK,
    renderModeBanner, copyButtonHtml, initCopyButtons,
    formatTokenAmount, convertToXlm, getTokenMetadata,
  } from './lumenflow-shared.js';

  // ── State Management ────────────────────────────────────────────────────────

  const filters = {
    merchant_address: '',
    date_start: '',
    date_end: '',
    amount_min: '',
    amount_max: '',
    token: '',
    status: 'Any'
  };

  // ── Initialize from URL ─────────────────────────────────────────────────────

  // Dates must be YYYY-MM-DD and parseable; buildFilterArg converts them to
  // BigInt, which throws on anything else.
  function isValidDateParam(value) {
    return /^\d{4}-\d{2}-\d{2}$/.test(value) && !Number.isNaN(Date.parse(value));
  }

  function initFromUrl() {
    const params = new URLSearchParams(window.location.search);
    inputBindings.forEach(({ id, key }) => {
      if (!params.has(key)) return;
      const value = params.get(key);
      const validator = filterValidators[id];
      if (validator) {
        const message = validator(value);
        showFilterError(id, message);
        if (message) return; // invalid URL params are dropped, never sent to the contract
      } else if ((key === 'date_start' || key === 'date_end') && value && !isValidDateParam(value)) {
        return;
      }
      filters[key] = value;
      document.getElementById(id).value = value;
    });
    renderActiveFilters();
    updateResults();
  }

  function updateUrl() {
    const params = new URLSearchParams();
    for (const key in filters) {
      if (filters[key] && filters[key] !== 'Any') params.set(key, filters[key]);
    }
    const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
    window.history.pushState({}, '', newUrl);
  }

  // ── Render Helpers ──────────────────────────────────────────────────────────

  function renderActiveFilters() {
    const container = document.getElementById('active-filters');
    container.innerHTML = '';
    const labels = { merchant_address: 'Merchant: ', date_start: 'From ', date_end: 'To ', amount_min: 'Min ', amount_max: 'Max ', token: 'Token: ', status: 'Status: ' };
    for (const key in filters) {
      const val = filters[key];
      if (val && val !== 'Any') {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerHTML = `<span>${labels[key]}${val}</span><button onclick="removeFilter('${key}')" aria-label="Remove filter ${labels[key]}${val}">&times;</button>`;
        container.appendChild(chip);
      }
    }
  }

  function removeFilter(key) {
    filters[key] = key === 'status' ? 'Any' : '';
    const idMap = { merchant_address: 'merchant-address', date_start: 'date-start', date_end: 'date-end', amount_min: 'amount-min', amount_max: 'amount-max', token: 'token-selector', status: 'status-selector' };
    const el = document.getElementById(idMap[key]);
    if (el) el.value = filters[key];
    updateUrl();
    renderActiveFilters();
    updateResults();
  }

  // ── Status badge ────────────────────────────────────────────────────────────
  const STATUS_MAP = {
    Completed:         { label: '✔ Completed',          cls: 'status-completed'         },
    PartiallyRefunded: { label: '↩ Partially Refunded', cls: 'status-partiallyrefunded' },
    FullyRefunded:     { label: '↩ Fully Refunded',     cls: 'status-fullyrefunded'     },
  };
  function statusBadgeHtml(status) {
    const entry = STATUS_MAP[status] || { label: status || 'Unknown', cls: 'status-unknown' };
    return `<span class="status-badge ${entry.cls}">${entry.label}</span>`;
  }

  function formatAmount(amount) {
    return (Number(amount) / 1e7).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 7 }) + ' XLM';
  }
  function formatDate(ts) { return new Date(Number(ts) * 1000).toLocaleString(); }

  // ── Mock data (demo mode) ───────────────────────────────────────────────────
  const MOCK_DATA = [
    { paid_at: BigInt(Math.floor(Date.now()/1000) - 86400),  order_id: 'ORD-9921', merchant_address: 'GBXGQJWVLWOYHFLVTKWV5FGHA3LNYY2JQKM7OAJAUEQFU6LPCSEFVXON', amount: BigInt(1245000000), status: 'Completed',         merchant_verified: true  },
    { paid_at: BigInt(Math.floor(Date.now()/1000) - 172800), order_id: 'ORD-8832', merchant_address: 'GBXGQJWVLWOYHFLVTKWV5FGHA3LNYY2JQKM7OAJAUEQFU6LPCSEFVXON', amount: BigInt(120000000),  status: 'Completed',         merchant_verified: true  },
    { paid_at: BigInt(Math.floor(Date.now()/1000) - 259200), order_id: 'ORD-7712', merchant_address: 'GBXGQJWVLWOYHFLVTKWV5FGHA3LNYY2JQKM7OAJAUEQFU6LPCSEFVXON', amount: BigInt(159900000),  status: 'PartiallyRefunded', merchant_verified: false },
    { paid_at: BigInt(Math.floor(Date.now()/1000) - 604800), order_id: 'ORD-6601', merchant_address: 'GBXGQJWVLWOYHFLVTKWV5FGHA3LNYY2JQKM7OAJAUEQFU6LPCSEFVXON', amount: BigInt(99900000),   status: 'FullyRefunded',     merchant_verified: false },
  ];

  // ── Soroban fetch ───────────────────────────────────────────────────────────
  async function fetchFromContract(merchantAddress) {
    const { SorobanRpc, Contract, nativeToScVal, scValToNative } =
      await import('https://cdn.jsdelivr.net/npm/@stellar/stellar-sdk@12/+esm');
    const server   = new SorobanRpc.Server(RPC_URL);
    const contract = new Contract(CONTRACT_ID);

    const filterArg = buildFilterArg(nativeToScVal);

    const result = await server.simulateTransaction(
      contract.call(
        'get_merchant_payment_history',
        nativeToScVal(merchantAddress, { type: 'address' }),
        nativeToScVal(null),           // cursor
        nativeToScVal(50, { type: 'u32' }), // limit
        filterArg,
        nativeToScVal('Date',       { type: 'symbol' }),
        nativeToScVal('Descending', { type: 'symbol' }),
      )
    );
    if (SorobanRpc.Api.isSimulationError(result)) {
      throw new Error(result.error || 'Contract call failed');
    }
    const page = scValToNative(result.result.retval);
    const payments = page.payments || [];

    // Enrich each payment with merchant verified status
    const uniqueAddresses = [...new Set(payments.map(p => p.merchant_address))];
    const verifiedMap = await fetchMerchantVerified(uniqueAddresses, { server, contract, nativeToScVal, scValToNative });
    return payments.map(p => ({
      ...p,
      merchant_verified: verifiedMap[p.merchant_address] ?? false,
    }));
  }

  // ── Batch-fetch merchant verified status ────────────────────────────────────
  async function fetchMerchantVerified(addresses, { server, contract, nativeToScVal, scValToNative }) {
    const verifiedMap = {};
    await Promise.all(addresses.map(async (addr) => {
      try {
        const res = await server.simulateTransaction(
          contract.call('get_merchant', nativeToScVal(addr, { type: 'address' }))
        );
        if (!res.error && res.result) {
          const merchant = scValToNative(res.result.retval);
          verifiedMap[addr] = merchant.verified === true;
        } else {
          verifiedMap[addr] = false;
        }
      } catch {
        verifiedMap[addr] = false;
      }
    }));
    return verifiedMap;
  }

  function buildFilterArg(nativeToScVal) {
    const hasFilter = filters.date_start || filters.date_end || filters.amount_min || filters.amount_max || filters.token || filters.status !== 'Any';
    if (!hasFilter) return nativeToScVal(null);
    return nativeToScVal({
      date_start:  filters.date_start  ? BigInt(new Date(filters.date_start).getTime() / 1000)  : null,
      date_end:    filters.date_end    ? BigInt(new Date(filters.date_end).getTime()   / 1000)  : null,
      amount_min:  filters.amount_min  ? BigInt(Math.round(Number(filters.amount_min) * 1e7))  : null,
      amount_max:  filters.amount_max  ? BigInt(Math.round(Number(filters.amount_max) * 1e7))  : null,
      token:       filters.token       || null,
      status:      filters.status !== 'Any' ? filters.status : null,
    });
  }

  // ── Skeleton rows ────────────────────────────────────────────────────────────
  const SKELETON_ROW_COUNT = 5;
  const SKELETON_WIDTHS = [
    ['w-date', 'w-id', 'w-addr', 'w-amount', 'w-status'],
    ['w-date', 'w-id', 'w-addr', 'w-amount', 'w-status'],
    ['w-date', 'w-id', 'w-addr', 'w-amount', 'w-status'],
    ['w-date', 'w-id', 'w-addr', 'w-amount', 'w-status'],
    ['w-date', 'w-id', 'w-addr', 'w-amount', 'w-status'],
  ];

  function renderSkeletonRows() {
    const body = document.getElementById('history-body');
    body.innerHTML = '';
    body.className = 'skeleton-body';
    for (let i = 0; i < SKELETON_ROW_COUNT; i++) {
      const tr = document.createElement('tr');
      // aria-busy and aria-hidden keep skeleton rows out of AT reading order
      tr.setAttribute('aria-busy', 'true');
      tr.setAttribute('aria-hidden', 'true');
      SKELETON_WIDTHS[i].forEach(cls => {
        const td = document.createElement('td');
        td.innerHTML = `<span class="skeleton-cell ${cls}"></span>`;
        tr.appendChild(td);
      });
      body.appendChild(tr);
    }
  }

  // ── UI state helpers ────────────────────────────────────────────────────────
  function showLoading() {
    // Hide prose loading indicator — skeletons inside the table give visual feedback
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('error-state').style.display   = 'none';
    document.getElementById('history-table').style.display = '';
    document.getElementById('empty-state').style.display   = 'none';
    renderSkeletonRows();
  }
  function showError(msg) {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('error-state').style.display   = 'block';
    document.getElementById('error-msg').textContent       = msg;
    document.getElementById('history-table').style.display = 'none';
    document.getElementById('empty-state').style.display   = 'none';
    // Clear skeleton rows so they are not present in the DOM while error shows
    const body = document.getElementById('history-body');
    body.innerHTML = '';
    body.className = '';
  }
  function showTable() {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('error-state').style.display   = 'none';
    document.getElementById('history-table').style.display = '';
    // skeleton rows are cleared by renderRows()
  }

  // ── Render rows ─────────────────────────────────────────────────────────────
  function renderRows(payments) {
    const body  = document.getElementById('history-body');
    const empty = document.getElementById('empty-state');
    body.innerHTML = '';
    body.className = ''; // clear skeleton-body class
    if (!payments.length) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    const currencyMode = document.getElementById('currency-display-toggle')
      ? document.getElementById('currency-display-toggle').value
      : 'native';
    payments.forEach(p => {
      const amountDisplay = currencyMode === 'xlm'
        ? convertToXlm(p.amount, p.token)
        : formatTokenAmount(p.amount, p.token);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td data-label="Date">${formatDate(p.paid_at)}</td>
        <td data-label="Order ID"><code>${p.order_id}</code>${copyButtonHtml(p.order_id, 'Copy order ID')}</td>
        <td data-label="Merchant"><code title="${p.merchant_address}">${p.merchant_address.slice(0,8)}…</code>${copyButtonHtml(p.merchant_address, 'Copy address')}</td>
        <td data-label="Amount" class="amount-cell">${amountDisplay}</td>
        <td data-label="Status">${statusBadgeHtml(p.status)}</td>`;
      body.appendChild(tr);
    });
  }

  // ── Main update ─────────────────────────────────────────────────────────────
  async function updateResults() {
    if (DEMO_MODE) {
      showTable();
      renderRows(MOCK_DATA);
      return;
    }

    const merchant = filters.merchant_address.trim();
    if (!merchant) {
      showTable();
      renderRows([]);
      document.getElementById('empty-state').style.display = 'block';
      document.getElementById('empty-state').textContent   = 'Enter a merchant address to load payment history.';
      return;
    }

    // Guards against invalid addresses arriving via URL params as well.
    if (validateAddress(merchant, { label: 'Merchant address' })) {
      showTable();
      renderRows([]);
      document.getElementById('empty-state').style.display = 'block';
      document.getElementById('empty-state').textContent   = 'Enter a valid merchant address (starts with G, 56 characters) to load payment history.';
      return;
    }

    showLoading();
    try {
      const payments = await fetchFromContract(merchant);
      showTable();
      renderRows(payments);
    } catch (e) {
      showError(e.message || 'Failed to fetch payment history from contract.');
    }
  }

  function retryFetch() { updateResults(); }

  // ── Event Listeners ─────────────────────────────────────────────────────────
  const inputBindings = [
    { id: 'merchant-address', key: 'merchant_address' },
    { id: 'date-start',       key: 'date_start'       },
    { id: 'date-end',         key: 'date_end'         },
    { id: 'amount-min',       key: 'amount_min'       },
    { id: 'amount-max',       key: 'amount_max'       },
    { id: 'token-selector',   key: 'token'            },
    { id: 'status-selector',  key: 'status'           },
  ];
  // Validators for free-text filter inputs; other filters need no validation.
  const filterValidators = {
    'merchant-address': v => validateAddress(v, { label: 'Merchant address', required: false }),
    'amount-min':       v => validateAmount(v, { label: 'Min amount', allowZero: true, required: false }),
    'amount-max':       v => validateAmount(v, { label: 'Max amount', allowZero: true, required: false }),
  };

  function showFilterError(id, message) {
    const errEl = document.getElementById(`${id}-err`);
    errEl.textContent = message;
    errEl.style.display = message ? 'block' : 'none';
    document.getElementById(id).classList.toggle('input-error', !!message);
  }

  inputBindings.forEach(({ id, key }) => {
    document.getElementById(id).addEventListener('change', e => {
      const validator = filterValidators[id];
      if (validator) {
        const message = validator(e.target.value);
        showFilterError(id, message);
        if (message) return; // invalid values are never applied or sent to the contract
      }
      filters[key] = e.target.value;
      updateUrl();
      renderActiveFilters();
      updateResults();
    });
  });

  window.removeFilter = removeFilter;
  window.retryFetch   = retryFetch;
  window.addEventListener('popstate', initFromUrl);
  renderModeBanner();
  initCopyButtons(document.body);

  // ── Currency display toggle ─────────────────────────────────────────────────
  const currencyToggleEl = document.getElementById('currency-display-toggle');
  if (currencyToggleEl) {
    currencyToggleEl.addEventListener('change', () => updateResults());
  }

  initFromUrl();
</script>

</main>
</body>
</html>
