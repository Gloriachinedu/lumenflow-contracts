<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://soroban-testnet.stellar.org https://horizon-testnet.stellar.org https://horizon.stellar.org; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none';" />
    <title>LumenFlow</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#6c47ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LumenFlow" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <!--
      SRI policy: every externally hosted <script> or <link rel="stylesheet"> MUST
      carry `integrity` and `crossorigin="anonymous"` attributes. Same-origin
      assets (e.g. styles.css) are covered by CSP 'self' and need no SRI.
      When adding/upgrading a CDN dependency, regenerate its hash with:
        curl -sSL <url> | openssl dgst -sha384 -binary | openssl base64 -A
      then set integrity="sha384-<hash>" and crossorigin="anonymous".
      CI enforces this via scripts/check-sri.mjs.
    -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>LumenFlow</h1>
      <p>Scalable, secure, and decentralized payments on Stellar Soroban.</p>
      <nav style="margin-top:1.5rem;display:flex;flex-wrap:wrap;gap:0.75rem;">
        <a href="dashboard.html" style="font-weight:600;color:#6c47ff;text-decoration:none;padding:0.45rem 1rem;border:1.5px solid #6c47ff;border-radius:8px;">Merchant Dashboard</a>
        <a href="history.html"   style="font-weight:600;color:#6c47ff;text-decoration:none;padding:0.45rem 1rem;border:1.5px solid #6c47ff;border-radius:8px;">Payment History</a>
        <a href="receipt.html"   style="font-weight:600;color:#6c47ff;text-decoration:none;padding:0.45rem 1rem;border:1.5px solid #6c47ff;border-radius:8px;">View Receipt</a>
        <a href="multisig.html"  style="font-weight:600;color:#6c47ff;text-decoration:none;padding:0.45rem 1rem;border:1.5px solid #6c47ff;border-radius:8px;">Multisig Payment</a>
      </nav>
    </main>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js', { scope: './' })
            .catch((err) => console.warn('[PWA] Service worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
