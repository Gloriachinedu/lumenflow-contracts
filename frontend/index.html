  <body>
    <main>
      <h1>LumenFlow</h1>

      <nav style="margin-top:1.5rem;display:flex;flex-wrap:wrap;gap:0.75rem;">

        <a href="history.html"   style="font-weight:600;color:#6c47ff;text-decoration:none;padding:0.45rem 1rem;border:1.5px solid #6c47ff;border-radius:8px;">Payment History</a>
        <a href="receipt.html"   style="font-weight:600;color:#6c47ff;text-decoration:none;padding:0.45rem 1rem;border:1.5px solid #6c47ff;border-radius:8px;">View Receipt</a>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js', { scope: './' })
            .catch((err) => console.warn('[PWA] Service worker registration failed:', err));
        });
      }
    </script>
    <script>
      // Form auto-save: persist non-sensitive payment form state to sessionStorage
      // so accidental navigation does not lose entered data.
      (function () {
        var STORAGE_KEY = 'lumenflow:autosave:index';
        // Only these fields are ever persisted.
        var ALLOWED_FIELDS = [
          'amount',
          'asset',
          'destination',
          'memo',
          'memoType',
          'fee',
          'network',
          'note',
          'email',
          'reference',
        ];
        // Never persist these, even if they match an allow-listed name pattern.
        var DENIED_PATTERN = /(private|secret|seed|mnemonic|passphrase|password|pin|key)/i;

        function isAllowed(name) {
          if (!name) return false;
          if (DENIED_PATTERN.test(name)) return false;
          return ALLOWED_FIELDS.indexOf(name) !== -1;
        }

        function getForm() {
          return document.querySelector('form[data-autosave]') || document.querySelector('form');
        }

        function collectState(form) {
          var state = {};
          if (!form) return state;
          var elements = form.querySelectorAll('input, select, textarea');
          for (var i = 0; i < elements.length; i++) {
            var el = elements[i];
            var name = el.name || el.id;
            if (!isAllowed(name)) continue;
            if (el.type === 'password' || el.type === 'hidden') continue;
            if (el.type === 'checkbox' || el.type === 'radio') {
              state[name] = el.checked;
            } else {
              state[name] = el.value;
            }
          }
          return state;
        }

        function saveState(form) {
          try {
            var state = collectState(form);
            if (Object.keys(state).length === 0) return;
            sessionStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch (err) {
            console.warn('[Autosave] Failed to save form state:', err);
          }
        }

        function clearState() {
          try {
            sessionStorage.removeItem(STORAGE_KEY);
          } catch (err) {
            console.warn('[Autosave] Failed to clear form state:', err);
          }
        }

        function readState() {
          try {
            var raw = sessionStorage.getItem(STORAGE_KEY);
            if (!raw) return null;
            var parsed = JSON.parse(raw);
            return parsed && typeof parsed === 'object' ? parsed : null;
          } catch (err) {
            console.warn('[Autosave] Failed to read form state:', err);
            return null;
          }
        }

        function applyState(form, state) {
          if (!form || !state) return;
          var elements = form.querySelectorAll('input, select, textarea');
          for (var i = 0; i < elements.length; i++) {
            var el = elements[i];
            var name = el.name || el.id;
            if (!isAllowed(name)) continue;
            if (!Object.prototype.hasOwnProperty.call(state, name)) continue;
            if (el.type === 'checkbox' || el.type === 'radio') {
              el.checked = !!state[name];
            } else {
              el.value = state[name];
            }
            el.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }

        function init() {
          var form = getForm();
          if (!form) return;

          var saved = readState();
          if (saved && Object.keys(saved).length > 0) {
            var restore = window.confirm('Restore previous session?');
            if (restore) {
              applyState(form, saved);
            } else {
              clearState();
            }
          }

          form.addEventListener('input', function () {
            saveState(form);
          });
          form.addEventListener('change', function () {
            saveState(form);
          });

          form.addEventListener('submit', function () {
            // Clear saved state on successful submission.
            clearState();
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }
      })();
    </script>
  </body>
</html>
